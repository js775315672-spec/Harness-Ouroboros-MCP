name: Qwen 7B CPU resident server vs CLI A-B study
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/qwen-server-vs-cli.yml"
      - "scripts/qwen_server_cli_comparison.py"
      - "qwen_evolve/llama_server.py"
      - "tests/test_qwen_server_cli_comparison.py"
      - "scripts/qwen_ab_three_session_replication.py"
      - "tests/test_qwen_ab_three_session_replication.py"
      - "scripts/qwen_function_level_probe.py"
      - "tests/test_qwen_function_level_probe.py"
      - "tests/heldout_merge_intervals.py"
      - "benchmarks/qwen7b_function_tier_v1.lock.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qwen7b-server-cli-ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live_official_qwen_cpu_comparison:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 43
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      CUDA_VISIBLE_DEVICES: ""
      NO_PROXY: "127.0.0.1,localhost"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Offline A-B safety, parity and frozen baseline checks
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_qwen_evolve.py -v
          python3 -m unittest discover -s tests -p test_qwen_evolve_security.py -v
          python3 -m unittest discover -s tests -p test_qwen_server_cli_comparison.py -v
          python3 -m unittest discover -s tests -p test_qwen_ab_three_session_replication.py -v
          python3 -m unittest discover -s tests -p test_qwen_function_level_probe.py -v
          python3 scripts/harness_check.py
      - name: Compile two binaries from same pinned no-CUDA llama.cpp commit
        run: |
          set -euo pipefail
          mkdir -p vendor/llama.cpp
          git -C vendor/llama.cpp init -q
          git -C vendor/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C vendor/llama.cpp fetch --depth 1 --no-tags origin 4e5116f47619dac4180c3007ef02a383f347554c
          git -C vendor/llama.cpp checkout -q --detach FETCH_HEAD
          test "$(git -C vendor/llama.cpp rev-parse HEAD)" = "4e5116f47619dac4180c3007ef02a383f347554c"
          cmake -S vendor/llama.cpp -B vendor/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DLLAMA_CURL=OFF \
            -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_SERVER=ON
          cmake --build vendor/llama.cpp/build --config Release \
            --target llama-completion llama-server -j 4
          test -x vendor/llama.cpp/build/bin/llama-completion
          test -x vendor/llama.cpp/build/bin/llama-server
      - name: Download official Qwen 7B GGUF with license and SHA provenance
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "huggingface_hub==0.36.0"
          python3 scripts/gguf_official_download.py \
            --model 7b --destination models \
            --report artifacts/qwen-ab-weights-provenance.json
      - name: Run same prompts on fresh CLI processes vs resident local server
        run: |
          python3 scripts/qwen_server_cli_comparison.py \
            --root . \
            --cli vendor/llama.cpp/build/bin/llama-completion \
            --server vendor/llama.cpp/build/bin/llama-server \
            --gguf models/qwen2.5-coder-7b-instruct-q4_k_m.gguf \
            --provenance artifacts/qwen-ab-weights-provenance.json \
            --report artifacts/qwen-ab/ab-report.json
          test -z "$(git status --porcelain --untracked-files=all -- scripts tests qwen_evolve benchmarks)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/qwen-ab/ab-report.json").read_text())
          assert r["status"]=="comparison_measured"
          assert r["summary"]["equal_prompt_sequence"] is True
          assert r["merge_authorized"] is False
          assert r["summary"]["autonomous_coding_proven"] is False
          print("PASS: identical prompts, fixed configuration, real CPU comparison measured")
          PY
      - name: Independently restart server three times and preserve all A-B failures
        run: |
          python3 scripts/qwen_ab_three_session_replication.py run \
            --root . \
            --cli vendor/llama.cpp/build/bin/llama-completion \
            --server vendor/llama.cpp/build/bin/llama-server \
            --gguf models/qwen2.5-coder-7b-instruct-q4_k_m.gguf \
            --provenance artifacts/qwen-ab-weights-provenance.json \
            --directory artifacts/ab-three-restarts
          python3 scripts/qwen_ab_three_session_replication.py verify \
            --directory artifacts/ab-three-restarts
          test -z "$(git status --porcelain --untracked-files=all -- scripts tests benchmarks qwen_evolve)"
      - name: Pull locked-down Docker image before evaluating new model code
        run: docker pull python:3.11-slim
      - name: Probe genuinely new full Python function with held-out immutable tests
        run: |
          python3 scripts/qwen_function_level_probe.py \
            --root . \
            --server vendor/llama.cpp/build/bin/llama-server \
            --gguf models/qwen2.5-coder-7b-instruct-q4_k_m.gguf \
            --metadata artifacts/qwen-ab-weights-provenance.json \
            --report artifacts/function-tier/function-probe-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/function-tier/function-probe-report.json").read_text())
          assert r["model_calls"] == 1
          assert r["benchmark"] == "qwen7b-function-merge-intervals-v1"
          assert r["outcome"] in (
              "function_heldout_passed", "function_heldout_failed",
              "static_ast_rejected")
          assert r["merge_authorized"] is False
          assert r["ci_attested_task_completion"] == 0
          print("Function-level result (PASS or FAIL, no retuning):",r["outcome"])
          PY
          test -z "$(git status --porcelain --untracked-files=all -- scripts tests benchmarks qwen_evolve)"
      - name: Report measured latency and failures, never claim coding autonomy
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path("artifacts/qwen-ab/ab-report.json")
          r=json.loads(p.read_text()) if p.exists() else {"status":"not_run"}
          print("## Qwen 7B CPU server vs CLI (opt-in A/B)")
          print("- experiment status:",r["status"])
          s=r.get("summary")
          if s:
              print("- Exact same four ChatML prompts:",s["equal_prompt_sequence"])
              print("- CLI cold-per-call median seconds:",s["cli"]["per_call_median_seconds"])
              print("- Resident-server median seconds:",s["server"]["per_call_median_seconds"])
              print("- Resident-server startup seconds:",s["server_startup_seconds"])
              print("- CLI AST acceptable:",s["cli"]["ast_accepted"],"/4")
              print("- Server AST acceptable:",s["server"]["ast_accepted"],"/4")
              print("- Median request speedup (CLI/server):",
                    s["median_request_latency_speedup_if_greater_than_one"])
              print("- Includes server cold startup in aggregate wall comparison:",
                    s["server_startup_plus_batch_wall_seconds"])
          else:
              print("- infrastructure blocker:",r.get("error_type","not_available"))
          print("- Grammar, feedback retries and speculative decoding: NOT USED")
          rep=Path("artifacts/ab-three-restarts/replication-report.json")
          if rep.exists():
              x=json.loads(rep.read_text())["summary"]
              print("- Replication sessions measured / planned:",
                    x["sessions_measured"],"/",x["sessions_planned"])
              print("- Across-session median of per-session latency ratios:",
                    x["median_session_ratio"])
              print("- Sessions are on ONE runner, not independent hosts")
          function=Path("artifacts/function-tier/function-probe-report.json")
          if function.exists():
              x=json.loads(function.read_text())
              print("- Held-out full-function task:",x.get("outcome"))
              print("- Held-out result is NOT a multi-file coding result")
          print("- No merges, paid APIs, agent autonomy, deployment or live trading.")
          PY
      - name: Upload evidence, never upload 7B weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-qwen7b-server-vs-cli-ab-evidence
          path: |
            artifacts/qwen-ab/ab-report.json
            artifacts/qwen-ab/llama-server-last.log
            artifacts/qwen-ab-weights-provenance.json
            artifacts/ab-three-restarts/
            artifacts/function-tier/
          if-no-files-found: warn
          retention-days: 7
