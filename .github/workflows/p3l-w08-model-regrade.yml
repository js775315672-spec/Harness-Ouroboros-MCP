name: W08 independent regrade of preserved model output
on:
  pull_request:
    paths:
      - ".github/workflows/p3l-w08-model-regrade.yml"
permissions:
  contents: read
  actions: read
jobs:
  regrade:
    if: github.repository == 'js775315672-spec/Harness-Ouroboros-MCP' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/p3l-w08-assert-regrade'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: candidate
          ref: '8ba5fa0117b1acee6061b5d1fcd8518b1998bdcc'
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - name: Reconstruct and verify reviewed candidate
        working-directory: candidate
        run: |
          test "$(git rev-parse 'HEAD^{tree}')" = '0863df1be5c336415f8ed2a5fcd7d15e31ffea16'
          exact=$(printf '%s' '' | base64 -d | git hash-object -t commit -w --stdin)
          test "$exact" = '3cbbf0adb1bc3e958e0a7430fbcfea3fa710e267'
          git -c advice.detachedHead=false checkout --detach "$exact"
          test "$(git rev-parse HEAD)" = '3cbbf0adb1bc3e958e0a7430fbcfea3fa710e267'
          sha256sum tests/test_resumable_task_queue.py
      - name: Fetch the previously recorded worker artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/"$GITHUB_REPOSITORY"/actions/runs/44461996014 | jq -e '.head_sha == "fa2e49cb36c11cede3335d459ebcedca9fd38f0f" and .head_branch == "run/p3l-w08-checkpoint-cas-outline" and .run_attempt == 1 and .conclusion == "failure"' >/dev/null
          gh api repos/"$GITHUB_REPOSITORY"/actions/runs/44461996014/jobs | jq -e '[.jobs[] | select(.id == 135352162620 and .name == "worker" and .conclusion == "success")] | length == 1' >/dev/null
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/14500875906/zip > "$RUNNER_TEMP/model.zip"
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/14501110073/zip > "$RUNNER_TEMP/grant.zip"
          printf '%s  %s\n' d948854745193a37f92f7378743582ead4d8db4fce71c2f9dc9549ed409a7f9b "$RUNNER_TEMP/model.zip" e2ea34ba92fcc6f0374138c8f09c91d82409ae865ac3a2769fb81b13b7059c25 "$RUNNER_TEMP/grant.zip" | sha256sum -c -
      - name: Grade unchanged model bytes in Docker
        run: |
          docker pull python:3.11-slim
          PYTHONPATH=harness/scripts python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import zipfile
          from p3l_w04_attempt_registry import AttemptInput
          from p3l_w08_evidence_handoff import sha
          import p3l_w08_model_worker as worker
          from p3l_w08_verify_test import verify

          temp = Path(os.environ["RUNNER_TEMP"])
          run_id = 44461996014
          with zipfile.ZipFile(temp / "model.zip") as archive:
              proposal = archive.read("w08-proposal.py")
              receipt = archive.read("w08-model-receipt.json")
          with zipfile.ZipFile(temp / "grant.zip") as archive:
              grant = archive.read("w08-grant.json")
          if sha(proposal) != "ac28786b74d52eaa76195c23022791ba29c679531ded8688ef0bba471e15e677":
              raise SystemExit("W08 recorded proposal changed")
          inputs = AttemptInput("w08-checkpoint-cas", worker.CONTRACT_SHA, worker.CANDIDATE_COMMIT,
                                "fa2e49cb36c11cede3335d459ebcedca9fd38f0f", worker.QWEN_REVISION, worker.QWEN_WEIGHTS_SHA256,
                                "95af14f9b7015becc5483ec8d8a680ef71a0bbd7fc6cb185c2fc88196239e50a", worker.PROMPT_SHA256)
          source = worker.validate_model_receipt(receipt, proposal, inputs, run_id,
                                                  "76f4fb11d626bddcb10edb6ee4a28aaea8ad8a089a21a5c171f26566ce62ded4",
                                                  grant, "0b4a7fefb6292d65f1c6447c6ad426ef6694f29bbfb20eca79e0ac4a0310d07f",
                                                  rehearsal=False)
          result = {"new_model_calls": 0, "source": source, "grade": verify(Path("candidate"), proposal)}
          output = json.dumps(result, sort_keys=True)
          (temp / "w08-model-regrade.json").write_text(output + "\n")
          print(output)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w08-model-regrade
          path: ${{ runner.temp }}/w08-model-regrade.json
          if-no-files-found: error
          retention-days: 7
