name: ORIL v2 slot4 Qwen local path preflight (experimental)
on:
  pull_request:
    paths:
      - 'scripts/oril_v2_local_qwen_adapter.py'
      - 'tests/test_oril_v2_local_qwen_adapter.py'
      - 'tests/test_oril_v2_slot4_qwen_model_path.py'
      - '.github/workflows/oril-v2-slot4-qwen-model-path.yml'
permissions:
  contents: read
jobs:
  checkpoint-path-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          git rev-parse HEAD
          python3 -m unittest discover -s tests -p 'test_oril_v2_local_qwen_adapter.py' -v
          python3 -m unittest discover -s tests -p 'test_oril_v2_slot4_qwen_model_path.py' -v
