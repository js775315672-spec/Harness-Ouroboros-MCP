name: ORIL v2 local Qwen adapter protocol (experimental)
on:
  push:
    paths:
      - 'scripts/oril_v2_local_qwen_adapter.py'
      - 'tests/test_oril_v2_local_qwen_adapter.py'
      - 'docs/oril_v2_local_qwen_adapter.md'
      - '.github/workflows/oril-v2-local-qwen-adapter.yml'
  pull_request:
    paths:
      - 'scripts/oril_v2_local_qwen_adapter.py'
      - 'tests/test_oril_v2_local_qwen_adapter.py'
      - 'docs/oril_v2_local_qwen_adapter.md'
      - '.github/workflows/oril-v2-local-qwen-adapter.yml'
permissions:
  contents: read
jobs:
  mock-protocol-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          git rev-parse HEAD
          python3 -m unittest discover -s tests -p test_oril_v2_local_qwen_adapter.py -v
