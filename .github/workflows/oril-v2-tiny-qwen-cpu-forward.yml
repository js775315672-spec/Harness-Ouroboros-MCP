name: ORIL v2 actual tiny Qwen2 CPU forward smoke (random weights)
on:
  pull_request:
    paths:
      - 'scripts/oril_v2_tiny_qwen_cpu_forward_smoke.py'
      - 'scripts/oril_v2_local_qwen_adapter.py'
      - 'docs/oril_v2_slot5_real_qwen_cpu_forward_smoke.md'
      - '.github/workflows/oril-v2-tiny-qwen-cpu-forward.yml'
permissions:
  contents: read
jobs:
  real-cpu-forward-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Record exact tested SHA and runner
        run: |
          git rev-parse HEAD
          python --version
      - name: Install real CPU model dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==4.51.3 tokenizers==0.21.1 safetensors==0.5.3
      - name: Execute actual CPU generation twice (random Qwen2 weights only)
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python scripts/oril_v2_tiny_qwen_cpu_forward_smoke.py > tiny_qwen_forward_report.json
          python - <<'PY'
          import json
          x=json.load(open('tiny_qwen_forward_report.json'))
          assert x['model_forward_executed'] is True
          assert x['two_real_cpu_generations'] is True
          assert x['actual_tokenizer_input_token_delta'] > 0
          assert x['pretrained_weights'] is False
          assert x['gpu_used'] is False
          assert x['optimizer_steps'] == 0
          assert x['lora_adapter_created'] is False
          assert x['independent_heldout_evaluation'] is False
          assert x['model_intelligence_gain'] is None
          print(json.dumps(x, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-qwen2-cpu-forward-evidence
          path: tiny_qwen_forward_report.json
          retention-days: 7
