name: ORIL v2 preopened root FD boundary (experimental)
on:
  push:
    branches:
      - oril-v2-slot5-preopened-fd-boundary-20261120
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preopened-root-fd:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independent root FD cases
        run: python -m unittest discover -s tests -p 'test_oril_v2_preopened_root_fd.py' -v
      - name: Prior root boundary regression
        run: python -m unittest discover -s tests -p 'test_oril_v2_root_binding_boundary.py' -v
      - name: Prior descriptor regression
        run: python -m unittest discover -s tests -p 'test_oril_v2_fd_evidence_snapshot.py' -v
