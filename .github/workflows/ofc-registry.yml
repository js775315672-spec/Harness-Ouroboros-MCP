name: P0 registry checks
on:
  pull_request:
    paths:
      - 'agent/cycle_registry.py'
      - 'agent/test_cycle_registry.py'
      - '.github/workflows/ofc-registry.yml'
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python agent/test_cycle_registry.py -v
