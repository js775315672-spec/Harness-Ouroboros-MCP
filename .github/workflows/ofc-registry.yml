name: P0 registry checks
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - 'agent/cycle_registry.py'
      - 'agent/test_cycle_registry.py'
      - '.github/workflows/ofc-registry.yml'
permissions:
  contents: read
jobs:
  registry:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify target and snapshot registry
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "Verification target: $TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags origin refs/heads/ofc-cycle-registry-v1:refs/remotes/origin/ofc-registry-audit
          python -c 'import json,subprocess as s; r="refs/remotes/origin/ofc-registry-audit"; print(s.check_output(["git","rev-parse",r],text=True).strip()); assert s.check_output(["git","ls-tree","-z","--name-only",r])==b"state.json\0"; d=json.loads(s.check_output(["git","show",r+":state.json"])); assert d["schema"]==1 and isinstance(d["results"],dict); print("generation",d["generation"],"pending",d["pending"])'
      - run: python agent/test_cycle_registry.py -v
