name: P0 registry checks
on:
  pull_request:
    paths:
      - 'agent/cycle_registry.py'
      - 'agent/test_cycle_registry.py'
      - '.github/workflows/ofc-registry.yml'
permissions:
  contents: read
jobs:
  registry:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python agent/test_cycle_registry.py -v
