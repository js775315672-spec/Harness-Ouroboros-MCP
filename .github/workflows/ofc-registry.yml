name: P0 registry checks
on:
  pull_request:
    paths:
      - 'agent/cycle_registry.py'
      - 'agent/test_cycle_registry.py'
      - 'agent/test_a1_recovery_safety.py'
      - '.github/workflows/ofc-registry.yml'
permissions:
  contents: read
jobs:
  registry:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Confirm exact PR head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run P0 registry regression tests
        run: |
          python agent/test_cycle_registry.py -v
          python agent/test_a1_recovery_safety.py -v
