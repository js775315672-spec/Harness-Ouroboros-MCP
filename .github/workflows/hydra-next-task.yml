name: Hydra next task proposal
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/hydra-next-task.yml, scripts/p3l_hydra_next_task.py, tests/test_hydra_next_task.py, docs/evolution/cycle-01-dispatch-preflight.json]
  push:
    branches: [main]
    paths: [.github/workflows/hydra-next-task.yml, scripts/p3l_hydra_next_task.py, tests/test_hydra_next_task.py, docs/evolution/cycle-01-dispatch-preflight.json]
  workflow_run:
    workflows: [Hydra standing approved tasks]
    branches: [main]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests
  propose:
    needs: test
    if: github.repository == 'js775315672-spec/Harness-Ouroboros-MCP' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'review/hydra-next-task'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select the next task from live read-only evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/p3l_hydra_next_task.py "$RUNNER_TEMP/hydra-next-task.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hydra-next-task
          path: ${{ runner.temp }}/hydra-next-task.json
          if-no-files-found: error
