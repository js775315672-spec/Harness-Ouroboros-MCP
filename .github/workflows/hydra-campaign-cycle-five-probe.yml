name: Hydra campaign cycle five probe
on:
  pull_request:
    branches: [review/hydra-campaign-cycle-four-candidate]
    paths: [.github/workflows/hydra-campaign-cycle-five-probe.yml]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    name: Worker checkpoint-sequence-type
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'experiment/hydra-campaign-cycle-five-probe' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Detect invalid checkpoint sequence type
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python3 -B - <<'PY'
          import json
          from pathlib import Path
          from p3l_hydra_campaign_continuity import fetch, next_sequence
          checkpoint=json.loads(Path("hydra/memory/campaign.json").read_bytes())
          fourth=dict(sequence=4,run=44588843880,job=135789212875,
                      head="04aa0873a78d86a13018350ff9d6deb124872acb",
                      task="campaign-memory-replay-44586167242",model_result_run=44586167242)
          completed=[*checkpoint["completed"],fourth]
          if next_sequence({**checkpoint,"completed":completed},fetch)["next_sequence"] != 5:
              raise RuntimeError("could not verify four production predecessors")
          invalid=[{**completed[0],"sequence":True},*completed[1:]]
          try:
              next_sequence({**checkpoint,"completed":invalid},fetch)
          except ValueError:
              pass
          else:
              raise AssertionError("boolean sequence advanced a verified campaign checkpoint")
          PY
  propose:
    needs: probe
    if: failure() && needs.probe.result == 'failure' && github.head_ref == 'experiment/hydra-campaign-cycle-five-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Retrieve the actual failure and propose its successor task
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          PYTHONPATH=scripts python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from p3l_hydra_next_task import REPO, fetch
          run_id = int(os.environ["GITHUB_RUN_ID"])
          root = f"repos/{REPO}/actions"
          run = fetch(f"{root}/runs/{run_id}")
          assert run["head_sha"] == os.environ["APPROVED_HEAD"]
          assert run["head_branch"] == "experiment/hydra-campaign-cycle-five-probe"
          assert run["event"] == "pull_request" and run["run_attempt"] == 1
          assert run["path"] == ".github/workflows/hydra-campaign-cycle-five-probe.yml"
          jobs = fetch(f"{root}/runs/{run_id}/attempts/1/jobs")["jobs"]
          job, = [j for j in jobs if j["name"] == "Worker checkpoint-sequence-type"]
          assert job["run_id"] == run_id and job["status"] == "completed" and job["conclusion"] == "failure"
          step, = [s for s in job["steps"] if s["name"] == "Detect invalid checkpoint sequence type"]
          assert step["conclusion"] == "failure"
          identity = hashlib.sha256(f"{run_id}:{job['id']}".encode()).hexdigest()[:20]
          task = dict(id="hydra-problem-"+identity, state="proposed", model_calls=0,
                      task="Reject non-integer sequence values in verified campaign receipts.",
                      target="scripts/p3l_hydra_campaign_continuity.py", run_id=run_id,
                      job_id=job["id"], head=run["head_sha"],
                      url=f"https://github.com/{REPO}/actions/runs/{run_id}/job/{job['id']}")
          Path(os.environ["RUNNER_TEMP"], "proposal.json").write_text(json.dumps(task, sort_keys=True))
          print(json.dumps(task, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hydra-campaign-cycle-five-proposal
          path: ${{ runner.temp }}/proposal.json
          if-no-files-found: error
