name: Hydra campaign cycle four probe
on:
  pull_request:
    branches: [review/hydra-campaign-cycle-three-candidate]
    paths: [.github/workflows/hydra-campaign-cycle-four-probe.yml]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    name: Worker stale-campaign-checkpoint
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'experiment/hydra-campaign-cycle-four-probe' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Detect stale campaign checkpoint after verified production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python3 -B - <<'PY'
          import json
          from pathlib import Path
          from p3l_hydra_campaign_continuity import fetch, next_sequence
          checkpoint=json.loads(Path("hydra/memory/campaign.json").read_bytes())
          first,=checkpoint["completed"]
          second=dict(sequence=2,run=44560093173,job=135686805027,
                      head="98a50941c19b847f1a00e7937e716f39ebf63b3d",
                      task="continuity-replay-44558947017",model_result_run=44558947017)
          third=dict(sequence=3,run=44565309602,job=135705473970,
                     head="7dcaf6660f3a81b9ff9a7a6e35789ca23bb6d17f",
                     task="continuity-replay-44562246674",model_result_run=44562246674)
          expected=next_sequence({**checkpoint,"completed":[first,second,third]},fetch)
          if expected["next_sequence"] != 4:
              raise RuntimeError("could not verify all three predecessors")
          observed=next_sequence(checkpoint,fetch)
          if observed["next_sequence"] != expected["next_sequence"]:
              raise AssertionError("persisted campaign checkpoint is stale after verified production")
          PY
  propose:
    needs: probe
    if: failure() && needs.probe.result == 'failure' && github.head_ref == 'experiment/hydra-campaign-cycle-four-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Retrieve the actual failure and propose its successor task
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          PYTHONPATH=scripts python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from p3l_hydra_next_task import REPO, fetch
          run_id = int(os.environ["GITHUB_RUN_ID"])
          root = f"repos/{REPO}/actions"
          run = fetch(f"{root}/runs/{run_id}")
          assert run["head_sha"] == os.environ["APPROVED_HEAD"]
          assert run["head_branch"] == "experiment/hydra-campaign-cycle-four-probe"
          assert run["event"] == "pull_request" and run["run_attempt"] == 1
          assert run["path"] == ".github/workflows/hydra-campaign-cycle-four-probe.yml"
          jobs = fetch(f"{root}/runs/{run_id}/attempts/1/jobs")["jobs"]
          job, = [j for j in jobs if j["name"] == "Worker stale-campaign-checkpoint"]
          assert job["run_id"] == run_id and job["status"] == "completed" and job["conclusion"] == "failure"
          step, = [s for s in job["steps"] if s["name"] == "Detect stale campaign checkpoint after verified production"]
          assert step["conclusion"] == "failure"
          identity = hashlib.sha256(f"{run_id}:{job['id']}".encode()).hexdigest()[:20]
          task = dict(id="hydra-problem-"+identity, state="proposed", model_calls=0,
                      task="Advance the persisted campaign checkpoint beyond the last verified production receipt.",
                      target="hydra/memory/campaign.json", run_id=run_id,
                      job_id=job["id"], head=run["head_sha"],
                      url=f"https://github.com/{REPO}/actions/runs/{run_id}/job/{job['id']}")
          Path(os.environ["RUNNER_TEMP"], "proposal.json").write_text(json.dumps(task, sort_keys=True))
          print(json.dumps(task, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hydra-campaign-cycle-three-proposal
          path: ${{ runner.temp }}/proposal.json
          if-no-files-found: error
