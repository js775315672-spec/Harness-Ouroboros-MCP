name: Hydra matched CPU rehearsal
on:
  pull_request:
    paths:
      - ".github/workflows/p3l-hydra-matched-cpu.yml"
      - "scripts/p3l_hydra_matched_cpu.py"
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == 'js775315672-spec/Harness-Ouroboros-MCP' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/p3l-hydra-matched-cpu'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run alternating serial and two-lane trials on the same CPUs
        shell: bash
        run: python3 -B scripts/p3l_hydra_matched_cpu.py | tee "$RUNNER_TEMP/hydra-matched-cpu.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hydra-matched-cpu-results
          path: ${{ runner.temp }}/hydra-matched-cpu.json
          if-no-files-found: error
          retention-days: 7
