name: ORIL v2 slot4 CI trend evidence audit (experimental)
on:
  pull_request:
    paths:
      - 'scripts/oril_v2_ci_cycle_trend_audit.py'
      - 'tests/test_oril_v2_ci_cycle_trend_audit.py'
      - 'docs/oril_v2_slot4_ci_cycle_trend_evidence.md'
      - '.github/workflows/oril-v2-slot4-ci-cycle-trend.yml'
permissions:
  contents: read
jobs:
  offline-ci-trend-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          git rev-parse HEAD
          python3 -m unittest discover -s tests -p 'test_oril_v2_ci_cycle_trend_audit.py' -v
