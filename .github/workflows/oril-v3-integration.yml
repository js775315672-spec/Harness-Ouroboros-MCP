name: ORIL v3 integration
on:
  pull_request:
    branches: [main]
    paths: ['oril/**', '.github/workflows/oril-v3-*.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: oril-public-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests
  first:
    needs: regression
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/oril-v3-cycle.yml
    with:
      cycle: 1
  second:
    needs: first
    uses: ./.github/workflows/oril-v3-cycle.yml
    with:
      cycle: 2
  third:
    needs: second
    uses: ./.github/workflows/oril-v3-cycle.yml
    with:
      cycle: 3
