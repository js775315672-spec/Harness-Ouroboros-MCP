name: ORIL slot4 prompt replay regression
on:
  pull_request:
    branches:
      - audit/oril-slot4-replay-prompt-binding-20261121
    paths:
      - 'oril/checkpoint.py'
      - 'tests/test_oril_campaign_replay.py'
      - '.github/workflows/oril-slot4-replay-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oril-slot4-replay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify full public archive and forged prompt/hypothesis rejection
        run: python3 -B -m unittest discover -s tests -p 'test_oril_campaign_replay.py' -v
      - name: Full regression
        run: python3 -B -m unittest discover -s tests
