name: ORIL v2 slot4 independent public30 A-A audit (experimental)
on:
  pull_request:
    paths:
      - 'scripts/oril_v2_slot4_public30_aa_independent_audit.py'
      - 'tests/test_oril_v2_slot4_public30_aa_independent_audit.py'
      - '.github/workflows/oril-v2-slot4-public30-aa-audit.yml'
      - 'docs/oril_v2_slot4_public30_aa_independent_audit.md'
permissions:
  contents: read
jobs:
  independent-public-aa:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          git rev-parse HEAD
          python3 -m unittest discover -s tests -p test_oril_v2_slot4_public30_aa_independent_audit.py -v
