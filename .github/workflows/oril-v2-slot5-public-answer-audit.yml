name: ORIL v2 slot5 independent public Qwen answer audit (experimental)
on:
  pull_request:
    paths:
      - 'scripts/oril_v2_slot5_public_answer_independent_audit.py'
      - 'tests/test_oril_v2_slot5_public_answer_independent_audit.py'
      - 'docs/oril_v2_slot5_public_answer_independent_audit.md'
      - '.github/workflows/oril-v2-slot5-public-answer-audit.yml'
permissions:
  contents: read
jobs:
  public-answer-independent-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Independent offline recomputation tests
        run: python3 -m unittest discover -s tests -p test_oril_v2_slot5_public_answer_independent_audit.py -v
      - name: Install pinned pretrained Qwen CPU dependencies
        run: |
          python3 -m pip install --disable-pip-version-check 'torch==2.5.1' 'transformers==4.46.3' 'huggingface_hub==0.26.5' 'safetensors==0.4.5'
      - name: Real public Qwen paired diagnostic (not LoRA or heldout)
        run: python3 scripts/oril_v2_slot2_pretrained_paired_diagnostic.py --output pretrained_pairs.json
      - name: Independently recompute public exact answers from raw model text
        run: python3 scripts/oril_v2_slot5_public_answer_independent_audit.py --input pretrained_pairs.json --output public_answer_audit.json
      - name: Preserve evidence for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: slot5-public-answer-audit
          path: |
            pretrained_pairs.json
            public_answer_audit.json
          if-no-files-found: ignore
          retention-days: 7
