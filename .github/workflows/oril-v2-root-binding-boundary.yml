name: ORIL v2 root binding boundary (experimental)
on:
  push:
    branches:
      - oril-v2-slot3-preopened-root-fd-20261120
  workflow_dispatch:
permissions:
  contents: read
jobs:
  root-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Root timing adversarial cases
        run: python -m unittest discover -s tests -p 'test_oril_v2_root_binding_boundary.py' -v
      - name: Parent snapshot regression
        run: python -m unittest discover -s tests -p 'test_oril_v2_fd_evidence_snapshot.py' -v
