name: Hydra core review
on:
  pull_request:
    branches: [main, review/hydra-core-main]
    paths:
      - ".github/workflows/hydra-core-review.yml"
      - "scripts/p3l_hydra*.py"
      - "tests/test_p3l_hydra*.py"
      - "tests/fixtures/p3l_hydra_fast_lane_plan.json"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run Hydra core tests
        run: python3 -B -m unittest discover -s tests -p 'test_p3l_hydra*.py' -v
