name: ORIL v2 raw sample integrity offline tests
on:
  pull_request:
    paths:
      - scripts/oril_v2_raw_sample_integrity.py
      - tests/test_oril_v2_raw_sample_integrity.py
      - .github/workflows/oril-v2-raw-sample-integrity.yml
permissions:
  contents: read
jobs:
  offline-raw-sample-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run raw sample integrity regression suite
        run: python3 -m unittest discover -s tests -p test_oril_v2_raw_sample_integrity.py -v
