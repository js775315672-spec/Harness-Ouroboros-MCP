name: Isolated verified patch and followup task sequence
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/isolated-model-patch-sequence.yml"
      - "scripts/isolated_model_patch_sequence.py"
      - "tests/test_isolated_model_patch_sequence.py"
      - "scripts/model_task_queue_bridge.py"
      - "proposals/feedback_cycle_guard_7b.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apply_and_test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run offline patch-stage and tampering tests
        run: |
          python -m unittest discover -s tests -p test_isolated_model_patch_sequence.py -v
          python -m unittest discover -s tests -p test_model_task_queue_bridge.py -v
      - name: Prefetch disposable no-network Docker image
        run: docker pull python:3.11-slim
      - name: Independently attest model patch and queue, then apply in isolated checkout
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          python scripts/model_task_queue_bridge.py prepare --docker \
            --head-sha "$CHECKOUT_SHA" \
            --out artifacts/patch-sequence/handoff
          python scripts/isolated_model_patch_sequence.py \
            --handoff artifacts/patch-sequence/handoff \
            --commit "$CHECKOUT_SHA" --phase 1 \
            --report artifacts/patch-sequence/phase1.json
          python - <<'PY'
          import json
          p=json.load(open("artifacts/patch-sequence/phase1.json"))
          assert p["status"] == "isolated_phase_passed"
          assert p["source_applied_in_disposable_checkout"] is True
          assert p["host_source_modified"] is False
          assert p["ouroboros_queue_completed_tasks"] == 0
          assert p["merge_authorized"] is False
          print("PHASE 1 PASS: model patch applied in isolated source and checked in Docker")
          PY
          test -z "$(git status --porcelain -- scripts/feedback_controller.py)"
      - name: Upload bounded handoff and phase-1 receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-model-patch-phase1
          path: artifacts/patch-sequence/
          if-no-files-found: error
          retention-days: 7

  deterministic_followup:
    needs: apply_and_test
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Restore previous job's checkpoint and patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: isolated-model-patch-phase1
          path: artifacts/patch-sequence
      - name: Prefetch disposable no-network Docker image
        run: docker pull python:3.11-slim
      - name: Restore queue and run second deterministic test task
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          python scripts/model_task_queue_bridge.py verify \
            --head-sha "$CHECKOUT_SHA" \
            --out artifacts/patch-sequence/handoff
          python scripts/isolated_model_patch_sequence.py \
            --handoff artifacts/patch-sequence/handoff \
            --commit "$CHECKOUT_SHA" --phase 2 \
            --previous artifacts/patch-sequence/phase1.json \
            --report artifacts/patch-sequence/phase2.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("artifacts/patch-sequence/phase2.json").read_text())
          q=json.loads(Path("artifacts/patch-sequence/handoff/queue.json").read_text())
          assert p["status"]=="isolated_phase_passed" and p["phase"]==2
          assert p["model_generated_followup"] is False
          assert p["ouroboros_queue_completed_tasks"]==0
          assert p["merge_authorized"] is False
          assert q["index"]==0 and q["generation"]==0
          print("PHASE 2 PASS: independent boundary testing; queue uncompleted; human merge gate")
          PY
          test -z "$(git status --porcelain -- scripts/feedback_controller.py)"
      - name: Upload second task test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-model-patch-phase2
          path: artifacts/patch-sequence/phase2.json
          if-no-files-found: error
          retention-days: 7
