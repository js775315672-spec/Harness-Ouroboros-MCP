name: ORIL v2 slot5 actual CPU raw sidecar audit (experimental)
on:
  pull_request:
    paths:
      - 'scripts/oril_v2_tiny_qwen_cpu_paired_benchmark.py'
      - 'tests/test_oril_v2_slot5_real_cpu_raw_sidecar.py'
      - '.github/workflows/oril-v2-slot5-real-cpu-raw-sidecar.yml'
permissions:
  contents: read
jobs:
  real-cpu-raw-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact SHA
        run: git rev-parse HEAD
      - name: Install pinned CPU model dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==4.51.3 tokenizers==0.21.1 safetensors==0.5.3
      - name: Run independent raw integration and prior regression suites
        run: |
          python -m unittest discover -s tests -p test_oril_v2_slot5_real_cpu_raw_sidecar.py -v
          python -m unittest discover -s tests -p test_oril_v2_cpu_raw_latency_sidecar_audit.py -v
          python -m unittest discover -s tests -p test_oril_v2_tiny_qwen_cpu_paired_benchmark.py -v
      - name: Execute actual 12 CPU generations and independently audit raw values
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python scripts/oril_v2_tiny_qwen_cpu_paired_benchmark.py --report synthetic_cpu_paired_report.json --sidecar synthetic_cpu_raw_sidecar.json
          python scripts/oril_v2_cpu_raw_latency_sidecar_audit.py synthetic_cpu_paired_report.json synthetic_cpu_raw_sidecar.json > independent_raw_arithmetic_audit.json
          python - <<'PY'
          import json
          report=json.load(open('synthetic_cpu_paired_report.json'))
          sidecar=json.load(open('synthetic_cpu_raw_sidecar.json'))
          audit=json.load(open('independent_raw_arithmetic_audit.json'))
          assert report['n_pairs']==6 and report['n_real_generations']==12
          assert len(sidecar['pairs'])==6
          assert audit['individual_latency_medians_arithmetic_verified'] is True
          assert audit['provenance_attested'] is False
          assert audit['independent_quality_verified'] is False
          assert audit['gpu_lora_verified'] is False
          assert report['pretrained_weights'] is False and report['gpu_used'] is False
          assert report['model_intelligence_gain'] is None
          print('actual synthetic CPU raw timing arithmetic verified; model quality NOT verified')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-cpu-raw-sidecar-audit
          path: |
            synthetic_cpu_paired_report.json
            synthetic_cpu_raw_sidecar.json
            independent_raw_arithmetic_audit.json
          retention-days: 7
