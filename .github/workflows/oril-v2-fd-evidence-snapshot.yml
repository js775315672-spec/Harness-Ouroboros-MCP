name: ORIL v2 FD evidence snapshot boundary (experimental)
on:
  pull_request:
    paths:
      - scripts/oril_v2_fd_evidence_snapshot.py
      - tests/test_oril_v2_fd_evidence_snapshot.py
      - .github/workflows/oril-v2-fd-evidence-snapshot.yml
permissions:
  contents: read
jobs:
  posix-fd-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: POSIX descriptor attack regression
        run: |
          python3 -m unittest discover -s tests -p test_oril_v2_fd_evidence_snapshot.py -v
