name: ORIL v2 dataset manifest pin offline tests
on:
  pull_request:
    paths:
      - scripts/oril_v2_dataset_manifest_attestation.py
      - tests/test_oril_v2_dataset_manifest_attestation.py
      - .github/workflows/oril-v2-dataset-manifest-attestation.yml
permissions:
  contents: read
jobs:
  offline-dataset-manifest-attestation:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify manifest pin and invalid JSON regressions
        run: python3 -m unittest discover -s tests -p test_oril_v2_dataset_manifest_attestation.py -v
