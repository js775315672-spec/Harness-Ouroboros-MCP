name: First operational cycle
on:
  push:
    branches: [p0/first-operational-cycle]
    paths: ['.github/workflows/first-operational-cycle.yml']
permissions:
  contents: write
  pull-requests: read
  checks: read
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cycle: ${{ steps.goal.outputs.cycle }}
    steps:
      - uses: actions/checkout@v6
      - run: git fetch origin main:refs/remotes/origin/main
      - id: goal
        run: python agent/first_operational_cycle.py
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: select
  handoff:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: git fetch origin main:refs/remotes/origin/main
      - run: python agent/first_operational_cycle.py
        env:
          STAGE: handoff
          EXPECTED_CYCLE: ${{ needs.select.outputs.cycle }}
