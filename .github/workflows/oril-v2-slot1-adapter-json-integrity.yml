name: ORIL v2 slot1 adapter JSON integrity (experimental)
on:
  pull_request:
    paths:
      - 'scripts/oril_v2_student_real_inference_probe.py'
      - 'tests/test_oril_v2_slot1_adapter_json_integrity.py'
      - '.github/workflows/oril-v2-slot1-adapter-json-integrity.yml'
  push:
    branches:
      - 'fix/oril-v2-slot1-adapter-json-integrity-20261121'
permissions:
  contents: read
jobs:
  strict-adapter-json:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record exact commit
        run: |
          git rev-parse HEAD
          python3 --version
      - name: Adapter JSON adversarial regression
        run: python3 -m unittest discover -s tests -p test_oril_v2_slot1_adapter_json_integrity.py -v
      - name: Existing inference and preflight regression
        run: |
          python3 -m unittest discover -s tests -p test_oril_v2_student_real_inference_probe.py -v
          python3 -m unittest discover -s tests -p test_oril_v2_slot5_report_preflight.py -v
          python3 -m unittest discover -s tests -p test_oril_v2_slot4_strict_heldout_json.py -v
