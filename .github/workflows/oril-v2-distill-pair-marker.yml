name: ORIL v2 distillation pair marker (experimental)
on:
  pull_request:
    paths:
      - 'scripts/oril_v2_distill_pair_marker.py'
      - 'tests/test_oril_v2_distill_pair_marker.py'
      - 'docs/oril_v2_distill_pair_marker_slot2.md'
      - '.github/workflows/oril-v2-distill-pair-marker.yml'
permissions:
  contents: read
jobs:
  offline-pair-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact SHA
        run: git rev-parse HEAD
      - name: Verify pair marker integrity
        run: python3 -m unittest discover -s tests -p test_oril_v2_distill_pair_marker.py -v
      - name: Verify inherited distillation tests
        run: |
          python3 -m unittest discover -s tests -p test_oril_v2_teacher_distillation_pack.py -v
          python3 -m unittest discover -s tests -p 'test_oril_v2_distillation_*py' -v
