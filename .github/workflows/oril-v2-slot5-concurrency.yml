name: ORIL slot5 concurrent trace boundary (experimental)
on:
  push:
    branches:
      - 'oril-v2-slot5-concurrent-trace-20261120'
  pull_request:
    paths:
      - 'tests/test_oril_v2_slot5_concurrency.py'
      - '.github/workflows/oril-v2-slot5-concurrency.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concurrency-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run stacked phase trace and concurrency tests
        run: |
          python3 -m unittest discover -s tests -p test_oril_v2_phase_trace.py -v
          python3 -m unittest discover -s tests -p test_oril_v2_slot5_concurrency.py -v
