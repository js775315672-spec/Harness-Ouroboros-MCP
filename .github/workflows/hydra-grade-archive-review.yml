name: Hydra grade archive integrity review
on:
  pull_request:
    paths: [.github/workflows/hydra-grade-archive-review.yml, scripts/p3l_hydra_standing.py]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'review/hydra-grade-archive'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check real archive and fail-closed negative cases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python3 -B - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          import p3l_hydra_standing as hydra

          approval, = json.loads(Path("hydra/approvals.json").read_text())["approvals"]
          proof, digest = hydra.model_result_proof(approval)
          assert proof["passed"] is True
          result = json.loads(Path("hydra/model-results/checkpoint-attestation-44515315325.json").read_text())
          assert digest == result["grade"]["candidate_sha256"]
          artifact, = [a for a in result["artifacts"] if a["name"] == "hydra-checkpoint-independent-grade"]
          raw = subprocess.check_output(["gh", "api", f"repos/{hydra.REPO}/actions/artifacts/{artifact['id']}/zip"], timeout=30)
          try:
              hydra.verify_grade_archive(raw + b"x", artifact, result["receipt"], result["grade"])
          except ValueError as error:
              assert "ZIP digest differs" in str(error)
          else:
              raise AssertionError("modified archive was accepted")
          try:
              hydra.verify_grade_archive(raw, artifact, result["receipt"], {**result["grade"], "normal_test_count": 8})
          except ValueError as error:
              assert "differs from ledger" in str(error)
          else:
              raise AssertionError("mismatched ledger grade was accepted")

          original = hydra.request
          def read_spent(method, route):
              assert method == "GET"
              return 200, json.dumps({"ref": "refs/" + route.removeprefix("/ref/"),
                    "object": {"type": "commit", "sha": approval["head"]}}).encode()
          hydra.request = read_spent
          try:
              assert hydra.claim(approval, "hydra-ledger/spent") is None
          finally:
              hydra.request = original
          print("GRADE INTEGRITY 4/4")
          PY
