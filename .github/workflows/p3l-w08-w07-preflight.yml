name: W08 pinned W07 preflight
on:
  pull_request:
    paths:
      - ".github/workflows/p3l-w08-w07-preflight.yml"
      - "scripts/p3l_w08_w07_gate.py"
  workflow_call:
permissions:
  actions: read
  contents: read
jobs:
  verify_w07:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: candidate
          ref: '8ba5fa0117b1acee6061b5d1fcd8518b1998bdcc'
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - name: Reconstruct and verify reviewed candidate
        working-directory: candidate
        run: |
          test "$(git rev-parse 'HEAD^{tree}')" = '0863df1be5c336415f8ed2a5fcd7d15e31ffea16'
          exact=$(printf '%s' '' | base64 -d | git hash-object -t commit -w --stdin)
          test "$exact" = '3cbbf0adb1bc3e958e0a7430fbcfea3fa710e267'
          git -c advice.detachedHead=false checkout --detach "$exact"
          test "$(git rev-parse HEAD)" = '3cbbf0adb1bc3e958e0a7430fbcfea3fa710e267'
          sha256sum tests/test_resumable_task_queue.py
      - name: Verify and download exact W07 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/"$GITHUB_REPOSITORY"/actions/runs/44437891417 > "$RUNNER_TEMP/w07-run.json"
          gh api repos/"$GITHUB_REPOSITORY"/actions/runs/44437891417/artifacts > "$RUNNER_TEMP/w07-artifacts.json"
          jq -e '.id == 44437891417 and .head_sha == "9ba187a5a7bf48ea9d06098fc822ec3ebb824965" and .path == ".github/workflows/p3l-w07-candidate-verification.yml" and .run_attempt == 1 and .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/w07-run.json" >/dev/null
          jq -e '[.artifacts[] | select(.expired == false) | .id] | sort == [14488554720,14490125198]' "$RUNNER_TEMP/w07-artifacts.json" >/dev/null
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/14488554720/zip > "$RUNNER_TEMP/w07-ci.zip"
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/14490125198/zip > "$RUNNER_TEMP/w07-rollback.zip"
      - name: Validate commit, prompt, and both W07 artifacts
        shell: bash
        run: |
          python3 -B harness/scripts/p3l_w08_w07_gate.py --checkout candidate \
            --prompt harness/docs/p3l/W08-public-chatml.txt \
            --ci "$RUNNER_TEMP/w07-ci.zip" --rollback "$RUNNER_TEMP/w07-rollback.zip" | tee "$RUNNER_TEMP/w08-preflight.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w08-w07-preflight-receipt
          path: ${{ runner.temp }}/w08-preflight.json
          if-no-files-found: error
          retention-days: 7
