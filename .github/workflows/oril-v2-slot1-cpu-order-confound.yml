name: ORIL v2 slot1 CPU order confounding audit (experimental)
on:
  pull_request:
    paths:
      - 'scripts/oril_v2_cpu_pair_order_confound_audit.py'
      - 'tests/test_oril_v2_cpu_pair_order_confound_audit.py'
      - 'docs/oril_v2_slot1_cpu_order_confound.md'
      - '.github/workflows/oril-v2-slot1-cpu-order-confound.yml'
permissions:
  contents: read
jobs:
  independent-order-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: git rev-parse HEAD
      - name: Stratified CPU order diagnostics and raw integrity regression
        run: python3 -m unittest discover -s tests -p test_oril_v2_cpu_pair_order_confound_audit.py -v
