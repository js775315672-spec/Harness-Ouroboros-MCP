name: ORIL v2 slot2 feedback memory safety (experimental)
on:
  pull_request:
    paths:
      - 'scripts/oril_v2_slot2_feedback_memory_compiler.py'
      - 'tests/test_oril_v2_slot2_feedback_memory_compiler.py'
      - 'docs/oril_v2_slot2_feedback_memory_loop.md'
      - '.github/workflows/oril-v2-slot2-feedback-memory.yml'
permissions:
  contents: read
jobs:
  feedback-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: git rev-parse HEAD
      - run: python3 -m unittest discover -s tests -p 'test_oril_v2_slot2_feedback_memory_compiler.py' -v
