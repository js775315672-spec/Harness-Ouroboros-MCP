name: Hydra campaign cycle one probe
on:
  pull_request:
    branches: [review/hydra-cycle-memory]
    paths: [.github/workflows/hydra-campaign-cycle-one-probe.yml]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    name: Worker duplicate-cycle-evidence
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'experiment/hydra-campaign-cycle-one-probe' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Detect reused success evidence in the cycle index
        shell: bash
        run: |
          PYTHONPATH=scripts python3 -B - <<'PY'
          import copy, json
          from pathlib import Path
          from p3l_hydra_cycle_memory import select
          history=json.loads(Path("hydra/memory/history.json").read_bytes())
          copied=copy.deepcopy(history["cycles"][0])
          copied["cycle"]=4
          history["cycles"].append(copied)
          try:
              select(history, "")
          except ValueError:
              pass
          else:
              raise AssertionError("one verified run was credited to multiple cycles")
          PY
  propose:
    needs: probe
    if: failure() && needs.probe.result == 'failure' && github.head_ref == 'experiment/hydra-campaign-cycle-one-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Retrieve the actual failure and propose its successor task
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          PYTHONPATH=scripts python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from p3l_hydra_next_task import REPO, fetch
          run_id = int(os.environ["GITHUB_RUN_ID"])
          root = f"repos/{REPO}/actions"
          run = fetch(f"{root}/runs/{run_id}")
          assert run["head_sha"] == os.environ["APPROVED_HEAD"]
          assert run["head_branch"] == "experiment/hydra-campaign-cycle-one-probe"
          assert run["event"] == "pull_request" and run["run_attempt"] == 1
          assert run["path"] == ".github/workflows/hydra-campaign-cycle-one-probe.yml"
          jobs = fetch(f"{root}/runs/{run_id}/attempts/1/jobs")["jobs"]
          job, = [j for j in jobs if j["name"] == "Worker duplicate-cycle-evidence"]
          assert job["run_id"] == run_id and job["status"] == "completed" and job["conclusion"] == "failure"
          step, = [s for s in job["steps"] if s["name"] == "Detect reused success evidence in the cycle index"]
          assert step["conclusion"] == "failure"
          identity = hashlib.sha256(f"{run_id}:{job['id']}".encode()).hexdigest()[:20]
          task = dict(id="hydra-problem-"+identity, state="proposed", model_calls=0,
                      task="Reject duplicate independent and operational run receipts in the cycle memory index.",
                      target="scripts/p3l_hydra_cycle_memory.py", run_id=run_id,
                      job_id=job["id"], head=run["head_sha"],
                      url=f"https://github.com/{REPO}/actions/runs/{run_id}/job/{job['id']}")
          Path(os.environ["RUNNER_TEMP"], "proposal.json").write_text(json.dumps(task, sort_keys=True))
          print(json.dumps(task, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hydra-campaign-cycle-one-proposal
          path: ${{ runner.temp }}/proposal.json
          if-no-files-found: error
