name: ORIL v2 GPU log byte evidence boundary (experimental)
on:
  pull_request:
    paths:
      - scripts/oril_v2_gpu_log_byte_audit.py
      - tests/test_oril_v2_gpu_log_byte_audit.py
      - .github/workflows/oril-v2-gpu-log-byte-audit.yml
permissions:
  contents: read
jobs:
  offline-log-byte-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate original evidence contract
        run: python3 -m unittest discover -s tests -p test_oril_v2_training_evidence_audit.py -v
      - name: Validate log byte evidence boundary
        run: python3 -m unittest discover -s tests -p test_oril_v2_gpu_log_byte_audit.py -v
