name: OFC R3 independent signature safety
on:
  push:
    branches: ['ofc/p0-expired-lease-recovery-spec-20261122']
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  r3:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Enforce same-repository Draft scope before checkout
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          test "$SOURCE_REF" = 'ofc/p0-expired-lease-recovery-spec-20261122'
          test "$SOURCE_REPO" = "$TARGET_REPO"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
      - name: Verify exact Draft head SHA
        shell: bash
        env:
          EXPECTED: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Ed25519 verifier dependency
        run: python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==46.0.5
      - name: Run R3 signed receipt, rotation and global replay attack tests
        run: python agent/test_r_global_idempotency.py -v
      - name: Run P0 and C2 isolation regression tests
        run: |
          python agent/test_cycle_registry.py -v
          python agent/test_a1_recovery_safety.py -v
          python agent/test_p0_independent_audit.py -v
          python agent/test_c2_registry_safety.py -v
