name: W06 live budget rehearsal
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/p3l-w06-live-budget.yml"
      - "scripts/p3l_w06_live_budget_rehearsal.py"
permissions:
  contents: read
jobs:
  rehearsal:
    if: >-
      github.repository == 'js775315672-spec/Harness-Ouroboros-MCP' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'work/p3l-w06-live-budget-rehearsal' &&
      github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify real budget accepts one stub call
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 -B scripts/p3l_w06_live_budget_rehearsal.py
