name: ORIL v2 semantic mutation trust boundary (experimental)
on:
  pull_request:
    paths:
      - tests/test_oril_v2_semantic_mutation_boundary.py
      - tests/test_oril_v2_signed_ledger_boundary.py
      - scripts/oril_v2_exact_test_count_audit.py
      - .github/workflows/oril-v2-semantic-mutation-boundary.yml
permissions:
  contents: read
jobs:
  semantic-mutation-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require runtime and cryptographic dependencies
        run: |
          python3 --version
          command -v openssl
          command -v sha256sum
      - name: Run actual integrated suite with semantic mutation in isolated copy
        run: python3 -m unittest discover -s tests -p test_oril_v2_semantic_mutation_boundary.py -v
