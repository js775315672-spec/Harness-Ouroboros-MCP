name: ORIL v2 heldout group alias regression (experimental)
on:
  pull_request:
    paths:
      - 'scripts/oril_v2_student_real_inference_probe.py'
      - 'tests/test_oril_v2_student_real_inference_probe.py'
      - 'docs/oril_v2_slot3_heldout_group_alias.md'
      - '.github/workflows/oril-v2-heldout-group-alias.yml'
permissions:
  contents: read
jobs:
  heldout-group-alias:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: git rev-parse HEAD
      - run: python3 -m unittest discover -s tests -p test_oril_v2_student_real_inference_probe.py -v
