name: Bounded Qwen GGUF CPU comparison
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/gguf-cpu-comparison.yml'
      - 'scripts/gguf_*.py'
      - 'scripts/qwen_semantic_repair_loop.py'
      - 'tests/test_gguf_cpu_runtime.py'
permissions:
  contents: read
concurrency:
  group: gguf-cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gguf_05:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Offline adapter and governance tests (no downloaded model)
        run: |
          python -m unittest discover -s tests -p test_gguf_cpu_runtime.py -v
          python scripts/harness_check.py
      - name: Compile pinned llama.cpp CPU runner (no CUDA or CURL)
        run: |
          set -euo pipefail
          mkdir -p vendor/llama.cpp
          git -C vendor/llama.cpp init -q
          git -C vendor/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C vendor/llama.cpp fetch --depth 1 --no-tags origin 4e5116f47619dac4180c3007ef02a383f347554c
          git -C vendor/llama.cpp checkout -q --detach FETCH_HEAD
          test "$(git -C vendor/llama.cpp rev-parse HEAD)" = "4e5116f47619dac4180c3007ef02a383f347554c"
          cmake -S vendor/llama.cpp -B vendor/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DLLAMA_CURL=OFF \
            -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build vendor/llama.cpp/build --config Release --target llama-cli -j 4
          test -x vendor/llama.cpp/build/bin/llama-cli
      - name: Download official Apache-2.0 Qwen GGUF Q4_K_M with pinned model revision
        run: |
          python -m pip install --disable-pip-version-check "huggingface_hub==0.36.0"
          python scripts/gguf_official_download.py \
            --model 0.5b \
            --destination models \
            --report artifacts/gguf-05-provenance.json
      - name: Fetch base image for disposable no-network Docker tests
        run: docker pull python:3.11-slim
      - name: Run single bounded 0.5b GGUF experiment with AST and Docker feedback
        run: |
          python scripts/gguf_cpu_benchmark.py \
            --model 0.5b \
            --cli vendor/llama.cpp/build/bin/llama-cli \
            --gguf models/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf \
            --download-metadata artifacts/gguf-05-provenance.json \
            --timeout-seconds 150 \
            --output artifacts/gguf-05-result.json
      - name: Summarize outcomes truthfully; CI success is not model repair success
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,pathlib
          p=pathlib.Path("artifacts/gguf-05-result.json")
          r=json.loads(p.read_text()) if p.exists() else {"outcome":"benchmark_not_run"}
          print("## GGUF CPU experimental result — 0.5b")
          print("Outcome: `{}`".format(r.get("outcome")))
          print("Model calls: {}; Docker comparisons: {}".format(r.get("model_calls","n/a"),r.get("docker_comparisons","n/a")))
          print("First attempt passed: {}; after retry: {}".format(r.get("first_attempt_passed","n/a"),r.get("passed_after_retry","n/a")))
          print("No automatic merge or application was authorized.")
          PY
      - name: Publish bounded comparison evidence, not weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gguf-cpu-05-evidence
          path: |
            artifacts/gguf-05-provenance.json
            artifacts/gguf-05-result.json
          if-no-files-found: warn
          retention-days: 7
  gguf_15:
    needs: gguf_05
    if: ${{ always() && needs.gguf_05.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Offline adapter and governance tests (no downloaded model)
        run: |
          python -m unittest discover -s tests -p test_gguf_cpu_runtime.py -v
          python scripts/harness_check.py
      - name: Compile pinned llama.cpp CPU runner (no CUDA or CURL)
        run: |
          set -euo pipefail
          mkdir -p vendor/llama.cpp
          git -C vendor/llama.cpp init -q
          git -C vendor/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C vendor/llama.cpp fetch --depth 1 --no-tags origin 4e5116f47619dac4180c3007ef02a383f347554c
          git -C vendor/llama.cpp checkout -q --detach FETCH_HEAD
          test "$(git -C vendor/llama.cpp rev-parse HEAD)" = "4e5116f47619dac4180c3007ef02a383f347554c"
          cmake -S vendor/llama.cpp -B vendor/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DLLAMA_CURL=OFF \
            -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build vendor/llama.cpp/build --config Release --target llama-cli -j 4
          test -x vendor/llama.cpp/build/bin/llama-cli
      - name: Download official Apache-2.0 Qwen GGUF Q4_K_M with pinned model revision
        run: |
          python -m pip install --disable-pip-version-check "huggingface_hub==0.36.0"
          python scripts/gguf_official_download.py \
