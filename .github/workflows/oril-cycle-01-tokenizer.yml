name: ORIL Cycle 01 tokenizer preflight
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths: [.github/workflows/oril-cycle-01-tokenizer.yml, docs/evolution/cycle-01-model-input.chatml]
permissions:
  contents: read
jobs:
  tokenize:
    if: github.repository == 'js775315672-spec/Harness-Ouroboros-MCP' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'review/oril-cycle-01-baseline' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 179bf5eb704b35a03935248edd0d3491ab4f441d
          path: downloader
          persist-credentials: false
      - name: Build the pinned llama.cpp tokenizer
        run: |
          set -euo pipefail
          git init -q llama.cpp
          git -C llama.cpp fetch --depth 1 --no-tags https://github.com/ggml-org/llama.cpp.git 4e5116f47619dac4180c3007ef02a383f347554c
          git -C llama.cpp checkout -q --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = 4e5116f47619dac4180c3007ef02a383f347554c
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build llama.cpp/build --target llama-tokenize -j 4
      - name: Fetch the pinned official GGUF
        env:
          HF_HUB_DISABLE_XET: "1"
          HF_HUB_DOWNLOAD_TIMEOUT: "60"
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gguf-venv"
          "$RUNNER_TEMP/gguf-venv/bin/pip" install --disable-pip-version-check huggingface_hub==0.36.0
          timeout --kill-after=10s 8m "$RUNNER_TEMP/gguf-venv/bin/python" -u downloader/scripts/gguf_official_download.py --model 7b --destination models \
            --revision 13fb94bfda8c8cf22497dc57b78f391a9acb426a \
            --sha256 509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c \
            --report "$RUNNER_TEMP/model-provenance.json"
      - name: Check context fit with zero inference calls
        run: |
          set -euo pipefail
          prompt=docs/evolution/cycle-01-model-input.chatml
          model=models/qwen2.5-coder-7b-instruct-q4_k_m.gguf
          printf '%s  %s\n' 6b6807de14ac04bb5f3cdca04918a63bbd0fd1b83c4dc8b656d6b1451d1c205d "$prompt" | sha256sum -c -
          llama.cpp/build/bin/llama-tokenize -m "$model" -f "$prompt" --no-escape --parse-special --ids --show-count > "$RUNNER_TEMP/tokenizer-output.txt"
          tokens=$(sed -nE 's/^Total number of tokens: ([0-9]+)$/\1/p' "$RUNNER_TEMP/tokenizer-output.txt")
          [[ "$tokens" =~ ^[1-9][0-9]*$ ]]
          (( tokens + 800 + 1 <= 8192 ))
          jq -n --argjson tokens "$tokens" '{prompt_tokens:$tokens,output_limit:800,context_limit:8192,reserved_tokens:1,model_calls:0}' | tee "$RUNNER_TEMP/tokenizer-receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oril-cycle-01-tokenizer-receipt
          path: ${{ runner.temp }}/tokenizer-receipt.json
          if-no-files-found: error
