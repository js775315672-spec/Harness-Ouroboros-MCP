name: Opt-in cloud Qwen CPU inference
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qwen-cpu-smoke-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cpu-inference:
    if: github.ref == 'refs/heads/feat/harness-governance-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout unprivileged
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --disable-pip-version-check "torch==2.6.0" "transformers==4.51.3" "safetensors==0.5.3"
      - name: Run public Qwen CPU inference
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: python scripts/cloud_model_smoke.py --output artifacts/cloud-model-smoke.json
      - name: Upload inference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloud-qwen-inference-evidence
          path: artifacts/cloud-model-smoke.json
          if-no-files-found: warn
          retention-days: 7
