name: Hydra campaign cycle seven probe
on:
  pull_request:
    branches: [review/hydra-campaign-cycle-six-candidate]
    paths: [.github/workflows/hydra-campaign-cycle-seven-probe.yml]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    name: Worker grade-archive-size
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'experiment/hydra-campaign-cycle-seven-probe' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Detect oversized grade archive metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python3 -B - <<'PY'
          import json
          from pathlib import Path
          from p3l_hydra_campaign_continuity import fetch, next_sequence
          checkpoint=json.loads(Path("hydra/memory/campaign.json").read_bytes())
          from p3l_hydra_grade_artifact import select_grade
          checkpoint["completed"].extend([
              dict(sequence=4,run=44588843880,job=135789212875,head="04aa0873a78d86a13018350ff9d6deb124872acb",
                   task="campaign-memory-replay-44586167242",model_result_run=44586167242),
              dict(sequence=5,run=44594970266,job=135810779067,head="009a51cf8da6c01d8b762e8caf8c1af570ef780a",
                   task="continuity-replay-44591454500",model_result_run=44591454500),
              dict(sequence=6,run=44600196766,job=135829291115,head="795b62642316d915bc0fb52d52858de466ac2140",
                   task="grade-artifact-replay-44597582618",model_result_run=44597582618),
          ])
          if next_sequence(checkpoint,fetch)["next_sequence"] != 7:
              raise RuntimeError("could not verify six production predecessors")
          live=fetch("repos/js775315672-spec/Harness-Ouroboros-MCP/actions/runs/44597582618/artifacts")["artifacts"]
          grade=select_grade(live,44597582618)
          if grade["id"] != 14567145984 or not 0 < grade["size_in_bytes"] <= 256000:
              raise RuntimeError("live control grade archive did not match")
          try:
              select_grade([{**grade,"size_in_bytes":256001}],44597582618)
          except ValueError:
              pass
          else:
              raise AssertionError("oversized grade archive metadata accepted by receipt selector")
          PY
  propose:
    needs: probe
    if: failure() && needs.probe.result == 'failure' && github.head_ref == 'experiment/hydra-campaign-cycle-seven-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Retrieve the actual failure and propose its successor task
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          PYTHONPATH=scripts python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from p3l_hydra_next_task import REPO, fetch
          run_id = int(os.environ["GITHUB_RUN_ID"])
          root = f"repos/{REPO}/actions"
          run = fetch(f"{root}/runs/{run_id}")
          assert run["head_sha"] == os.environ["APPROVED_HEAD"]
          assert run["head_branch"] == "experiment/hydra-campaign-cycle-seven-probe"
          assert run["event"] == "pull_request" and run["run_attempt"] == 1
          assert run["path"] == ".github/workflows/hydra-campaign-cycle-seven-probe.yml"
          jobs = fetch(f"{root}/runs/{run_id}/attempts/1/jobs")["jobs"]
          job, = [j for j in jobs if j["name"] == "Worker grade-archive-size"]
          assert job["run_id"] == run_id and job["status"] == "completed" and job["conclusion"] == "failure"
          step, = [s for s in job["steps"] if s["name"] == "Detect oversized grade archive metadata"]
          assert step["conclusion"] == "failure"
          identity = hashlib.sha256(f"{run_id}:{job['id']}".encode()).hexdigest()[:20]
          task = dict(id="hydra-problem-"+identity, state="proposed", model_calls=0,
                      task="Reject missing, zero, or oversized independent grade archive sizes before receipt preparation.",
                      target="scripts/p3l_hydra_grade_artifact.py", run_id=run_id,
                      job_id=job["id"], head=run["head_sha"],
                      url=f"https://github.com/{REPO}/actions/runs/{run_id}/job/{job['id']}")
          Path(os.environ["RUNNER_TEMP"], "proposal.json").write_text(json.dumps(task, sort_keys=True))
          print(json.dumps(task, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hydra-campaign-cycle-seven-proposal
          path: ${{ runner.temp }}/proposal.json
          if-no-files-found: error
