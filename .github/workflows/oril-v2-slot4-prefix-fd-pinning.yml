name: ORIL v2 slot4 descriptor pinned prompt (experimental)
on:
  pull_request:
    paths:
      - 'scripts/oril_v2_paired_prompt_variant_adapter.py'
      - 'tests/test_oril_v2_slot4_prefix_fd_pinning.py'
      - 'tests/test_oril_v2_paired_prompt_variant_adapter.py'
      - 'docs/oril_v2_slot4_prefix_fd_pinning.md'
      - '.github/workflows/oril-v2-slot4-prefix-fd-pinning.yml'
permissions:
  contents: read
jobs:
  descriptor-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Log tested SHA and POSIX environment
        run: |
          git rev-parse HEAD
          python3 --version
      - name: Existing prompt variant tests
        run: python3 -m unittest discover -s tests -p test_oril_v2_paired_prompt_variant_adapter.py -v
      - name: New descriptor and FIFO regression tests
        run: python3 -m unittest discover -s tests -p test_oril_v2_slot4_prefix_fd_pinning.py -v
