name: W08 checkpoint mutation probe
on:
  pull_request:
    paths:
      - ".github/workflows/p3l-w08-mutation-probe.yml"
permissions:
  contents: read
jobs:
  baseline:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/p3l-w08-mutation-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '8ba5fa0117b1acee6061b5d1fcd8518b1998bdcc'
          persist-credentials: false
      - name: Reconstruct and verify reviewed candidate
        run: |
          test "$(git rev-parse 'HEAD^{tree}')" = '0863df1be5c336415f8ed2a5fcd7d15e31ffea16'
          exact=$(printf '%s' '' | base64 -d | git hash-object -t commit -w --stdin)
          test "$exact" = '3cbbf0adb1bc3e958e0a7430fbcfea3fa710e267'
          git -c advice.detachedHead=false checkout --detach "$exact"
          test "$(git rev-parse HEAD)" = '3cbbf0adb1bc3e958e0a7430fbcfea3fa710e267'
          sha256sum tests/test_resumable_task_queue.py
      - name: Verify unmodified W08 Linux baseline
        run: python3 -B -m unittest discover -s tests -p test_resumable_task_queue.py -v
      - name: Prove the acceptance check rejects a stale second writer
        run: |
          python3 -B - <<'PY'
          import hashlib
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          probe = """
          import sys
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from threading import Barrier, Event
          import tempfile
          sys.path[:0] = ["scripts", "tests"]
          from test_resumable_task_queue import TASKS, REPO, COMMIT, evidence, github_ok
          from resumable_task_queue import advance, load, new_queue, save
          with tempfile.TemporaryDirectory() as directory:
              path = Path(directory) / "queue.json"
              base = new_queue(TASKS, REPO, COMMIT)
              save(path, base)
              first = advance(base, evidence(sha="b"*40), fetch=github_ok("b"*40))
              second = advance(base, evidence(sha="c"*40), fetch=github_ok("c"*40))
              ready = Barrier(2)
              committed = Event()
              def writer_one():
                  ready.wait(timeout=5)
                  save(path, first, expected_integrity=base["integrity"])
                  committed.set()
              def writer_two():
                  ready.wait(timeout=5)
                  if not committed.wait(timeout=5):
                      raise RuntimeError("first commit did not finish")
                  try:
                      save(path, second, expected_integrity=base["integrity"])
                  except ValueError as error:
                      if str(error) != "stale checkpoint generation":
                          raise
                      return False
                  return True
              with ThreadPoolExecutor(2) as pool:
                  a, b = pool.submit(writer_one), pool.submit(writer_two)
                  a.result(timeout=10)
                  accepted = b.result(timeout=10)
              if accepted:
                  if load(path) != second:
                      raise RuntimeError("accepted stale write was not persisted")
                  print("STALE_WRITE_ACCEPTED")
                  sys.exit(23)
              if load(path) != first or path.with_name("queue.json.lock").exists():
                  raise RuntimeError("rejected write changed state or left a lock")
              print("STALE_WRITE_REJECTED")
          """
          source = Path("scripts/resumable_task_queue.py")
          original = source.read_bytes()
          stale = b'elif load(path)["integrity"] != expected_integrity:'
          assert original.count(stale) == 1
          with tempfile.TemporaryDirectory() as temp:
              shadow = Path(temp)
              for directory in ("scripts", "tests"):
                  shutil.copytree(directory, shadow / directory)
              def run(expected, marker):
                  result = subprocess.run([sys.executable, "-B", "-c", probe], cwd=shadow,
                                          capture_output=True, text=True, timeout=20)
                  print(result.stdout, end="")
                  if result.returncode != expected or result.stdout.strip() != marker:
                      raise SystemExit(result.stderr or f"unexpected probe result {result.returncode}")
              run(0, "STALE_WRITE_REJECTED")
              mutant = original.replace(stale, b"elif False:")
              (shadow / source).write_bytes(mutant)
              run(23, "STALE_WRITE_ACCEPTED")
              print("mutant_sha256=" + hashlib.sha256(mutant).hexdigest())
          assert source.read_bytes() == original
          PY
