name: OFC v3.1 DEV P0 regression
on:
  pull_request:
    paths:
      - 'agent/cycle_registry.py'
      - 'agent/pending_reconcile.py'
      - 'agent/verified_pending_cas.py'
      - 'agent/actions_evidence.py'
      - 'agent/artifact_integrity.py'
      - 'scripts/verify_live_actions_artifacts.py'
      - 'tests/test_ofc_v31_artifact_integrity.py'
      - 'tests/test_ofc_v31_actions_evidence.py'
      - 'tests/test_ofc_v31_pending_reconcile.py'
      - 'tests/test_ofc_v31_verified_pending_cas.py'
      - 'tests/test_ofc_v31_adversarial_cas.py'
      - 'scripts/ofc_v31_cas_stress.py'
      - 'tests/test_ofc_v31_p0_regression.py'
      - 'tests/test_ofc_v31_d_recovery.py'
      - 'agent/qwen_evidence_gate.py'
      - 'tests/test_ofc_v31_qwen_evidence.py'
      - 'tests/test_ofc_v31_isolated_remote.py'
      - '.github/workflows/ofc-v31-dev-p0.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  isolated-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated P0 regression without external effects
        run: python -m unittest discover -s tests -p 'test_ofc_v31_*.py' -v
      - name: Prepare deterministic evidence
        shell: bash
        run: |
          mkdir -p ofc-evidence
          printf '%s\\n' 'run_id=${{ github.run_id }}' 'head_sha=${{ github.event.pull_request.head.sha || github.sha }}' 'os=${{ matrix.os }}' > ofc-evidence/provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ofc-v31-p0-${{ matrix.os }}
          path: ofc-evidence/provenance.txt
          if-no-files-found: error
  cas-stress:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 30 rounds each at 5 10 20 isolated CAS writers
        run: python -m scripts.ofc_v31_cas_stress
  verify-live-artifacts:
    needs: [isolated-regression, cas-stress]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download real ZIPs and compare SHA-256 digests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PINNED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m scripts.verify_live_actions_artifacts
