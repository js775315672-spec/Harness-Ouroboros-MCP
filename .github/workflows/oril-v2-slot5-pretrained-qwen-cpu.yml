name: ORIL v2 slot5 actual pretrained Qwen CPU inference (experimental)
on:
  pull_request:
    paths:
      - 'scripts/oril_v2_pretrained_qwen_cpu_smoke.py'
      - 'tests/test_oril_v2_pretrained_qwen_cpu_smoke.py'
      - 'docs/oril_v2_slot5_pretrained_qwen_cpu_smoke.md'
      - '.github/workflows/oril-v2-slot5-pretrained-qwen-cpu.yml'
permissions:
  contents: read
jobs:
  real-pretrained-cpu-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run independent offline contract tests
        run: python3 -m unittest discover -s tests -p 'test_oril_v2_pretrained_qwen_cpu_smoke.py' -v
      - name: Install pinned CPU-only dependencies
        run: |
          python3 -m pip install --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --no-cache-dir transformers==4.46.3 huggingface_hub==0.26.5 safetensors==0.4.5
      - name: Execute real pretrained Qwen CPU inference and record weights hash
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_ETAG_TIMEOUT: '30'
          OMP_NUM_THREADS: '2'
        run: |
          python3 scripts/oril_v2_pretrained_qwen_cpu_smoke.py --output pretrained_qwen_cpu_evidence.json
      - name: Verify evidence and exact runner SHA
        run: |
          python3 -c 'import json; from scripts.oril_v2_pretrained_qwen_cpu_smoke import validate_report; r=json.load(open("pretrained_qwen_cpu_evidence.json")); assert validate_report(r); print("Pretrained Qwen inference evidence validated")'
          git rev-parse HEAD
      - name: Upload immutable-in-run evidence for independent review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pretrained-qwen-cpu-evidence
          path: pretrained_qwen_cpu_evidence.json
          if-no-files-found: ignore
          retention-days: 7
