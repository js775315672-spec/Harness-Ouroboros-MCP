name: ORIL v3 public cycle
on:
  workflow_call:
    inputs:
      cycle:
        type: number
        required: true
permissions:
  contents: read
  actions: read
env:
  CYCLE: ${{ inputs.cycle }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  GH_TOKEN: ${{ github.token }}
  PYTHONUTF8: 1
jobs:
  infer:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Check canonical Actions owner and retry budget
        env:
          ORIL_STOP: ${{ vars.ORIL_STOP }}
        run: |
          test "${ORIL_STOP,,}" != "true"
          python3 oril/lease.py
      - id: checkpoint
        name: Inspect prior immutable checkpoint
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=raw-$CYCLE" > "$RUNNER_TEMP/checkpoint.json"
          present=$(jq -er 'if .total_count==0 then "false" elif .total_count==1 and .artifacts[0].expired==false then "true" else error("invalid checkpoint") end' "$RUNNER_TEMP/checkpoint.json")
          echo "present=$present" >> "$GITHUB_OUTPUT"
      - name: Restore immutable predecessor
        if: steps.checkpoint.outputs.present == 'false'
        run: |
          mkdir input
          if [[ "$CYCLE" == 1 ]]; then
            unzip -p docs/oril/evidence/44852655575/raw-1.zip input/public_30_pairs.json > input/public_30_pairs.json
          else
            gh run download "$GITHUB_RUN_ID" -n "review-$((CYCLE-1))" -D input
          fi
      - run: bash scripts/install_qwen_cpu_dependencies.sh
        if: steps.checkpoint.outputs.present == 'false'
      - run: python3 oril/orchestrator.py "$CYCLE"
        if: steps.checkpoint.outputs.present == 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.checkpoint.outputs.present == 'false'
        with:
          name: raw-${{ inputs.cycle }}
          path: |
            candidate/
            input/
          if-no-files-found: error
  public-audit:
    needs: infer
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f32dd7cc8b6e71995ae2c182ad6cc25c22ca0bdb
          path: grader
          persist-credentials: false
      - id: checkpoint
        name: Inspect prior immutable checkpoint
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=review-$CYCLE" > "$RUNNER_TEMP/checkpoint.json"
          present=$(jq -er 'if .total_count==0 then "false" elif .total_count==1 and .artifacts[0].expired==false then "true" else error("invalid checkpoint") end' "$RUNNER_TEMP/checkpoint.json")
          echo "present=$present" >> "$GITHUB_OUTPUT"
      - run: gh run download "$GITHUB_RUN_ID" -n "raw-$CYCLE"
        if: steps.checkpoint.outputs.present == 'false'
      - run: PYTHONPATH=grader/scripts python3 oril/public_handoff.py
        if: steps.checkpoint.outputs.present == 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.checkpoint.outputs.present == 'false'
        with:
          name: review-${{ inputs.cycle }}
          path: |
            memory.json
            audit.json
          if-no-files-found: error
