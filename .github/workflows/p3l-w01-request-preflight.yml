name: P3L W01 bounded worker request preflight
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/p3l-w01-request-preflight.yml"
      - "scripts/p3l_w01_request.py"
      - "tests/test_p3l_w01_request.py"
      - "docs/p3l/W01-ledger-contract.ko.md"
      - "scripts/development_ledger.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare_w01_only:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate W01 bounded request parser
        run: python3 -m unittest discover -s tests -p 'test_p3l_w01_request.py' -v
      - name: Prepare immutable W01 task request; zero model calls
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/p3l_w01_request.py \
            --root . --head-sha "$REVIEW_SHA" \
            --out artifacts/p3l-w01/request.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path('artifacts/p3l-w01/request.json').read_text(encoding='utf-8'))
          assert doc['model_calls'] == 0
          assert doc['executor_connected'] is False
          assert doc['merge_authorized'] is False
          assert doc['candidate_verified'] is False
          assert doc['status'] == 'PREPARED_AWAITING_EXECUTOR_AND_REVIEW'
          print('PASS: request only; NOT an AI-generated W01 deliverable')
          PY
      - name: Upload W01 request (not model output)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p3l-w01-unexecuted-request
          path: artifacts/p3l-w01/request.json
          if-no-files-found: error
          retention-days: 7
