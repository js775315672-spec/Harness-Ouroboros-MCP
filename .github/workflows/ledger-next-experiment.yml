# One CPU attempt with byte-exact ChatML and the public review checklist.
name: P3L W06 exact prompt and independent replay
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/ledger-next-experiment.yml"
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: "1"
  HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  CUDA_VISIBLE_DEVICES: ""
  PINNED_LLAMA_SHA: "4e5116f47619dac4180c3007ef02a383f347554c"
concurrency:
  group: w06-exact-chatml-http
  cancel-in-progress: true
jobs:
  offline_w01_w05_preflight:
    if: >-
      github.event.action == 'opened' &&
      github.run_attempt == '1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'experiment/p3l-w06-exact-chatml-http' &&
      github.event.pull_request.base.ref == 'experiment/p3l-w06-exact-chatml-verified'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout immutable PR commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Refuse any duplicate or unconfirmed experiment run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from time import sleep

          run_id = int(os.environ["GITHUB_RUN_ID"])
          branch = os.environ["GITHUB_HEAD_REF"]
          path = "repos/" + os.environ["GITHUB_REPOSITORY"] + "/actions/workflows/ledger-next-experiment.yml/runs"
          command = ["gh", "api", "--method", "GET", path,
                     "-f", f"branch={branch}", "-f", "event=pull_request", "-F", "per_page=100"]
          for attempt in range(12):
              results = json.loads(subprocess.check_output(command, timeout=10))
              count, runs = results["total_count"], results["workflow_runs"]
              if type(count) is not int or type(runs) is not list or count != len(runs):
                  raise SystemExit("Actions returned incomplete run history")
              if count:
                  run = runs[0]
                  if (count != 1 or type(run["id"]) is not int or run["id"] != run_id
                          or run["head_branch"] != branch or run["head_sha"] != os.environ["REVIEW_SHA"]
                          or type(run["run_attempt"]) is not int or run["run_attempt"] != 1):
                      raise SystemExit("Duplicate or unexpected Actions run")
                  print("Verified the only attempt for the exact experiment branch and HEAD")
                  break
              if attempt < 11:
                  sleep(5)
          else:
              raise SystemExit("Actions did not index the current run within the preflight budget")
          PY
      - name: Run all W01 to W06 offline tests and Harness safety gates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEW_SHA"
          python3 -m unittest discover -s tests -p test_p3l_w02_public_prompt_clarity.py -v
          python3 - <<'PY'
          import hashlib
          import sys
          sys.path.insert(0, 'scripts')
          from p3l_w02_model_handoff import build
          from p3l_w04_one_call_gate import plan
          handoff = build()
          gate = plan()
          assert 'Public W01 implementation checklist' in handoff['prompt']
          assert gate['prompt_sha256'] == hashlib.sha256(handoff['prompt'].encode('utf-8')).hexdigest()
          assert gate['prompt_sha256'] not in {
              '96185b3e99e89cb87570df68a655536fd81c6399a910fb1ac1e161beecfbedd1',
              '362758aa519c32d5c96e2abf8e5451b40b53a4b366adc1b719b2c7df6e1d7ff9',
              'bf6d4a7622814d0d560990a331efa54e31e629dd9dd4d320efe106b39d2dd73c',
              '38d713942e7ca1f5f58dc9f096652e495f8d4d133fb7aa2364017c295fd3b97b',
          }
          assert gate['decision'] == 'allow_one_model_call'
          assert gate['model_calls'] == 0 and gate['model_invoked'] is False
          print('PASS: new public W01 prompt and W04 single-call input gate (no model yet)')
          PY
          python3 -m unittest discover -s tests -p test_p3l_w04_one_call_gate.py -v
          python3 -m unittest discover -s tests -p test_p3l_w05_replay_evidence.py -v
          python3 -m unittest discover -s tests -p test_p3l_w06_actual_model_once.py -v
          python3 -m unittest discover -s tests -v
          python3 scripts/harness_check.py
          python3 scripts/governance.py
          python3 scripts/evaluation.py
          python3 scripts/p3l_w02_model_handoff.py --out artifacts/p3l-w06/w02.json
          python3 scripts/p3l_w03_rule_diagnostics.py --out artifacts/p3l-w06/w03.json
          python3 scripts/p3l_w04_one_call_gate.py --out artifacts/p3l-w06/w04.json
      - name: Reproduce genuine baseline security failure in disposable Docker
        run: |
          set -euo pipefail
          docker pull python:3.11-slim
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,"scripts")
          from p3g_qwen_ledger_feedback_repair import grade,TARGET
          root=Path(".").resolve()
          original=(root/TARGET).read_text(encoding="utf-8")
          result=grade(root,original)
          assert result["status"]=="real_source_patch_failed"
          assert result["baseline_legacy_green"] is True
          assert result["baseline_security_red"] is True
          print("PASS: frozen 25-case baseline failure reproduced; model has not run")
          PY

  pinned_llama_cpu_build:
    needs: offline_w01_w05_preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout same commit without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build pinned llama.cpp CPU executable only once
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEW_SHA"
          mkdir -p vendor/llama.cpp
          git -C vendor/llama.cpp init -q
          git -C vendor/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C vendor/llama.cpp fetch --depth 1 --no-tags origin "$PINNED_LLAMA_SHA"
          git -C vendor/llama.cpp checkout -q --detach FETCH_HEAD
          test "$(git -C vendor/llama.cpp rev-parse HEAD)" = "$PINNED_LLAMA_SHA"
          cmake -S vendor/llama.cpp -B vendor/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build vendor/llama.cpp/build --target llama-completion -j 4
          test -x vendor/llama.cpp/build/bin/llama-completion
          mkdir -p artifacts/w06-build
          cp vendor/llama.cpp/build/bin/llama-completion artifacts/w06-build/llama-completion
          cd artifacts/w06-build
          sha256sum llama-completion > SHA256SUMS
      - name: Upload pinned binary for this run only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p3l-w06-pinned-binary
          path: artifacts/w06-build/
          if-no-files-found: error
          retention-days: 3

  actual_qwen_model:
    if: github.run_attempt == '1'
    needs: [offline_w01_w05_preflight,pinned_llama_cpu_build]
    runs-on: ubuntu-latest
    timeout-minutes: 32
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.model_artifact.outputs.artifact-id }}
    env:
      REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout unchanged reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Get same-run pinned binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p3l-w06-pinned-binary
          path: artifacts/w06-build/
      - name: Check exact binary digest and executable boundary
        run: |
          set -euo pipefail
          cd artifacts/w06-build
          sha256sum -c SHA256SUMS
          test "$(stat -c %s llama-completion)" -ge 1000000
          test "$(stat -c %s llama-completion)" -le 100000000
          chmod 755 llama-completion
      - name: Download only official Apache-2.0 Qwen 7B GGUF
        timeout-minutes: 9
        env:
          HF_HUB_DISABLE_XET: "1"
          HF_HUB_DOWNLOAD_TIMEOUT: "60"
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "huggingface_hub==0.36.0"
          timeout --kill-after=10s 8m python3 -u scripts/gguf_official_download.py --model 7b --destination models \
            --revision 13fb94bfda8c8cf22497dc57b78f391a9acb426a \
            --sha256 509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c \
            --report artifacts/w06/model-provenance.json
      - name: Ask real Qwen for exactly one new ledger patch (no push, no merge)
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEW_SHA"
          python3 scripts/p3l_w06_actual_model_once.py --head-sha "$REVIEW_SHA" \
            --run-id "$GITHUB_RUN_ID" --llama-revision "$PINNED_LLAMA_SHA" \
            --cli artifacts/w06-build/llama-completion \
            --gguf models/qwen2.5-coder-7b-instruct-q4_k_m.gguf \
            --metadata artifacts/w06/model-provenance.json --out artifacts/w06/model-output.json
          test -z "$(git status --porcelain --untracked-files=all -- scripts tests configs)"
      - name: Keep raw model output and provenance on pass or failure
        id: model_artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p3l-w06-raw-model-output
          path: artifacts/w06/
          if-no-files-found: warn
          retention-days: 7

  independent_w05_replay:
    needs: [actual_qwen_model]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-id: ${{ steps.replay_artifact.outputs.artifact-id }}
    env:
      REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact original baseline again
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Independent W05 replay in fresh no-network Docker
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_ARTIFACT_ID: ${{ needs.actual_qwen_model.outputs.artifact-id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEW_SHA"
          docker pull python:3.11-slim
          result=0
          python3 scripts/p3l_w05_replay_evidence.py --head-sha "$REVIEW_SHA" \
            --artifact-id "$MODEL_ARTIFACT_ID" --run-id "$GITHUB_RUN_ID" \
            --out artifacts/w06-replay/verdict.json || result=$?
          test -z "$(git status --porcelain --untracked-files=all -- scripts tests configs)"
          exit "$result"
      - name: Save independent W05 verdict
        id: replay_artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p3l-w05-independent-docker-verdict
          path: artifacts/w06-replay/
          if-no-files-found: warn
          retention-days: 7

  strict_model_candidate_gate:
    if: always() && needs.actual_qwen_model.result == 'success'
    needs: [offline_w01_w05_preflight,pinned_llama_cpu_build,actual_qwen_model,independent_w05_replay]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require all 25 tests independently and retain review gate
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_ARTIFACT_ID: ${{ needs.actual_qwen_model.outputs.artifact-id }}
          REPLAY_ARTIFACT_ID: ${{ needs.independent_w05_replay.outputs.artifact-id }}
          REPLAY_RESULT: ${{ needs.independent_w05_replay.result }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEW_SHA"
          test "$REPLAY_RESULT" = success
          python3 scripts/p3l_w05_replay_evidence.py --head-sha "$REVIEW_SHA" \
            --artifact-id "$MODEL_ARTIFACT_ID" --run-id "$GITHUB_RUN_ID" \
            --verify-replay-artifact-id "$REPLAY_ARTIFACT_ID" \
            --out artifacts/w06-final/verified.json
      - name: Save verified review-only evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p3l-w06-verified-review-only
          path: artifacts/w06-final/
          if-no-files-found: error
          retention-days: 7
