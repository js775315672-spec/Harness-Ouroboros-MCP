name: Harness safety checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      p3l_review_candidate:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check out the pinned W07 candidate
        if: inputs.p3l_review_candidate
        uses: ./.github/actions/p3l-w07-checkout
      - name: Python regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Eight governance gates
        run: python3 scripts/governance.py
      - name: Ouroboros deterministic evaluation
        run: python3 scripts/evaluation.py
      - name: Read-only secret scan
        run: python3 scripts/harness_check.py
      - name: Evolution planner safety check
        run: python3 scripts/evolution_planner.py --completed 0 --target 30 --ceiling 10000
      - name: Development coordinator safety check
        run: python3 -c 'import sys;sys.path.insert(0,"scripts");from development_coordinator import coordinate;result=coordinate([]);assert result["verified_development_cycles"]==0;assert result["next"]["next_cycle"]==1'
      - name: Agent handoff contract safety check
        run: python3 scripts/agent_handoff.py --completed 0 --branch agent/cycle-1-baseline
      - name: Agent runner fail-closed safety check
        run: python3 scripts/agent_runner.py --completed 0 --branch agent/cycle-1-baseline --timeout 30
      - name: Agent sandbox policy safety check
        run: python3 scripts/sandbox_policy.py --completed 0 --branch agent/cycle-1-baseline --output artifacts/sandbox-policy.json
      - name: Harness model feedback safety check
        run: python3 -c 'import sys;sys.path.insert(0,"scripts");from task_selector import select;from feedback_controller import feedback;checks={k:{"status":"pass","log":""} for k in ("harness","ouroboros","regression","secrets")};assert feedback(select(),checks)["decision"]=="review"'
      - name: Multi-model adapter offline contract check
        run: python3 scripts/model_adapter.py --provider qwen --completed 0 --output artifacts/model-request.json
      - name: Model patch gate safety check
        run: python3 -m unittest discover -s tests -p test_patch_gate.py -v
      - name: Disposable AI patch staging regression tests
        run: python3 -m unittest discover -s tests -p test_isolated_patch_stage.py -v
      - name: Record handoff preparation runtime
        run: python3 scripts/handoff_runtime.py --completed 0 --branch agent/cycle-1-baseline --output artifacts/handoff-runtime.json
      - name: Autonomous loop controller state-machine regression tests
        run: python3 -m unittest discover -s tests -p test_autonomous_loop_controller.py -v
      - name: Autonomous loop controller dry-run contract
        run: |
          python3 scripts/autonomous_loop_controller.py > artifacts/autonomous-loop-dry-run.json
          python3 -c 'import json; x=json.load(open("artifacts/autonomous-loop-dry-run.json")); assert x["decision"]=="await_external_executor" and x["model_connected"] is False and x["code_executed"] is False'
      - name: Record actual CI verification receipt (not autonomous coding)
        run: python3 scripts/ci_execution_receipt.py --output artifacts/ci-execution-receipt.json
      - name: Thirty sequential Harness Ouroboros verification cycles
        run: python3 scripts/verification_cycles.py --rounds 30 --report artifacts/verification-timing.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.p3l_review_candidate && 'w07-candidate-ci-evidence' || 'verification-timing' }}
          path: |
            artifacts/verification-timing.json
            artifacts/handoff-runtime.json
            artifacts/sandbox-policy.json
            artifacts/model-request.json
            artifacts/autonomous-loop-dry-run.json
            artifacts/ci-execution-receipt.json
            ${{ inputs.p3l_review_candidate && format('{0}/w07-candidate.json', runner.temp) || '' }}
          if-no-files-found: ignore
          retention-days: 7
