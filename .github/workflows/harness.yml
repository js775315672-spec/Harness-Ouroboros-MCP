name: Harness safety checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Eight governance gates
        run: python3 scripts/governance.py
      - name: Read-only secret scan
        run: python3 scripts/harness_check.py
