name: Harness safety checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Eight governance gates
        run: python3 scripts/governance.py
      - name: Ouroboros deterministic evaluation
        run: python3 scripts/evaluation.py
      - name: Read-only secret scan
        run: python3 scripts/harness_check.py
      - name: Evolution planner safety check
        run: python3 scripts/evolution_planner.py --completed 0 --target 30 --ceiling 10000
      - name: Development coordinator safety check
        run: python3 -c 'import sys;sys.path.insert(0,"scripts");from development_coordinator import coordinate;result=coordinate([]);assert result["verified_development_cycles"]==0;assert result["next"]["next_cycle"]==1'
      - name: Agent handoff contract safety check
        run: python3 scripts/agent_handoff.py --completed 0 --branch agent/cycle-1-baseline
      - name: Agent runner fail-closed safety check
        run: python3 scripts/agent_runner.py --completed 0 --branch agent/cycle-1-baseline --timeout 30
      - name: Record handoff preparation runtime
        run: python3 scripts/handoff_runtime.py --completed 0 --branch agent/cycle-1-baseline --output artifacts/handoff-runtime.json
      - name: Thirty sequential Harness Ouroboros verification cycles
        run: python3 scripts/verification_cycles.py --rounds 30 --report artifacts/verification-timing.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-timing
          path: |
            artifacts/verification-timing.json
            artifacts/handoff-runtime.json
          if-no-files-found: ignore
          retention-days: 7
