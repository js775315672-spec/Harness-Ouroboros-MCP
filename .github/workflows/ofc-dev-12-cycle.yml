name: OFC DEV 12-cycle safety
on:
  pull_request:
    paths:
      - 'agent/dev_cycle_12.py'
      - 'tests/test_dev_cycle_12.py'
      - '.github/workflows/ofc-dev-12-cycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run bounded cycle safety regression
        run: python -m unittest discover -s tests -p 'test_dev_cycle_12.py' -v
