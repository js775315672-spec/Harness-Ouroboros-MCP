name: ORIL v2 distillation output safety (experimental)
on:
  push:
    branches: [fix/oril-v2-distill-exclusive-output-slot5-20261121]
  pull_request:
    paths:
      - 'scripts/oril_v2_teacher_distillation_pack.py'
      - 'tests/test_oril_v2_distillation_export_safety.py'
      - 'tests/test_oril_v2_teacher_distillation_pack.py'
      - '.github/workflows/oril-v2-distillation-export-safety.yml'
permissions:
  contents: read
jobs:
  export-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: git rev-parse HEAD
      - name: Distillation and output file safety regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_oril_v2_teacher_distillation_pack.py' -v
          python3 -m unittest discover -s tests -p 'test_oril_v2_distillation_export_safety.py' -v
