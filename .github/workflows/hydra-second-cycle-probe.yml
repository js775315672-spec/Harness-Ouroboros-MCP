name: Hydra second-cycle failure probe
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/hydra-second-cycle-probe.yml]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    name: Worker cancelled-worker-detection
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'experiment/hydra-second-cycle-probe' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Detect a cancelled approved worker
        shell: bash
        run: |
          PYTHONPATH=scripts python3 -B - <<'PY'
          from p3l_hydra_next_task import select
          run = dict(id=1, event="push", head_branch="main", status="completed", run_attempt=1, head_sha="a"*40)
          failed_worker = dict(id=2, name="Worker checkpoint-replay", conclusion="cancelled")
          result = select([run], {1: [failed_worker]})
          assert result["decision"] == "needs_approval", "cancelled approved worker is silently omitted"
          PY
  propose:
    needs: probe
    if: failure() && needs.probe.result == 'failure' && github.head_ref == 'experiment/hydra-second-cycle-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Retrieve the actual failure and propose its successor task
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          PYTHONPATH=scripts python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from p3l_hydra_next_task import REPO, fetch
          run_id = int(os.environ["GITHUB_RUN_ID"])
          root = f"repos/{REPO}/actions"
          run = fetch(f"{root}/runs/{run_id}")
          assert run["head_sha"] == os.environ["APPROVED_HEAD"]
          assert run["head_branch"] == "experiment/hydra-second-cycle-probe"
          assert run["event"] == "pull_request" and run["run_attempt"] == 1
          assert run["path"] == ".github/workflows/hydra-second-cycle-probe.yml"
          jobs = fetch(f"{root}/runs/{run_id}/attempts/1/jobs")["jobs"]
          job, = [j for j in jobs if j["name"] == "Worker cancelled-worker-detection"]
          assert job["run_id"] == run_id and job["status"] == "completed" and job["conclusion"] == "failure"
          step, = [s for s in job["steps"] if s["name"] == "Detect a cancelled approved worker"]
          assert step["conclusion"] == "failure"
          identity = hashlib.sha256(f"{run_id}:{job['id']}".encode()).hexdigest()[:20]
          task = dict(id="hydra-problem-"+identity, state="proposed", model_calls=0,
                      task="Handle cancelled approved workers in Hydra next-task selection.",
                      target="scripts/p3l_hydra_next_task.py", run_id=run_id,
                      job_id=job["id"], head=run["head_sha"],
                      url=f"https://github.com/{REPO}/actions/runs/{run_id}/job/{job['id']}")
          Path(os.environ["RUNNER_TEMP"], "proposal.json").write_text(json.dumps(task, sort_keys=True))
          print(json.dumps(task, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hydra-second-cycle-proposal
          path: ${{ runner.temp }}/proposal.json
          if-no-files-found: error
