name: Independent two-Qwen-patch Docker and queue replay
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/qwen-two-patch-replay.yml"
      - "scripts/qwen_two_patch_replay.py"
      - "tests/test_qwen_two_patch_replay.py"
      - "proposals/two_qwen_7b_patches_v1.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independently_verify_both_patches:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout unprivileged code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run offline source-provenance and queue-tampering checks
        run: |
          python -m unittest discover -s tests -p test_qwen_two_patch_replay.py -v
          python -m unittest discover -s tests -p test_qwen_second_task_trial.py -v
      - name: Prefetch disposable Docker base (no network in tests)
        run: docker pull python:3.11-slim
      - name: Independently replay BOTH source changes and prepare a pending two-task queue
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          python scripts/qwen_two_patch_replay.py prepare \
            --head-sha "$CHECKOUT_SHA" \
            --directory artifacts/two-model-patch-review
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path("artifacts/two-model-patch-review/receipt.json").read_text())
          checkpoint=json.loads(Path("artifacts/two-model-patch-review/queue.json").read_text())
          assert receipt["docker_replay"] == "independent_two_patch_replay_passed"
          assert receipt["task_count"] == 2 and receipt["completed_tasks"] == 0
          assert checkpoint["index"] == 0 and checkpoint["generation"] == 0
          assert receipt["merge_authorized"] is False
          print("PASS: second Qwen-authored patch independently replayed; no unearned queue credit")
          PY
          test -z "$(git status --porcelain -- scripts/feedback_controller.py)"
      - name: Publish two-task evidence but no model weights
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: two-model-patch-pending-queue
          path: artifacts/two-model-patch-review/
          if-no-files-found: error
          retention-days: 7

  verify_cross_job_recovery:
    needs: independently_verify_both_patches
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout unprivileged code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Restore untrusted artifacts for independent static validation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: two-model-patch-pending-queue
          path: artifacts/two-model-patch-review
      - name: Check exact source patch, queue integrity and unchanged work count
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          python scripts/qwen_two_patch_replay.py verify \
            --head-sha "$CHECKOUT_SHA" \
            --directory artifacts/two-model-patch-review
          test -z "$(git status --porcelain -- scripts/feedback_controller.py)"
          echo "PASS: two AI-authored patch review is restorable; queue progress is still zero"
