name: ORIL v2 real CPU paired Qwen2 synthetic benchmark (experimental)
on:
  pull_request:
    paths:
      - 'scripts/oril_v2_tiny_qwen_cpu_paired_benchmark.py'
      - 'tests/test_oril_v2_tiny_qwen_cpu_paired_benchmark.py'
      - '.github/workflows/oril-v2-tiny-qwen-cpu-paired.yml'
      - 'docs/oril_v2_slot1_real_cpu_paired_benchmark.md'
permissions:
  contents: read
jobs:
  actual-cpu-paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Record tested commit
        run: git rev-parse HEAD
      - name: Install pinned CPU model dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==4.51.3 tokenizers==0.21.1 safetensors==0.5.3
      - name: Reject invalid measurement reports
        run: python -m unittest discover -s tests -p test_oril_v2_tiny_qwen_cpu_paired_benchmark.py -v
      - name: Execute 12 actual Qwen2 CPU generations
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python scripts/oril_v2_tiny_qwen_cpu_paired_benchmark.py > synthetic_cpu_paired_report.json
          python - <<'PY'
          import json
          x=json.load(open('synthetic_cpu_paired_report.json'))
          assert x['n_pairs'] == 6 and x['n_real_generations'] == 12
          assert x['input_token_reduction_pct_median'] > 0
          assert x['pair_orders'] == ['compact_first', 'verbose_first'] * 3
          assert x['pretrained_weights'] is False
          assert x['gpu_used'] is False and x['optimizer_steps'] == 0
          assert x['lora_adapter_created'] is False
          assert x['independent_heldout_evaluation'] is False
          assert x['model_intelligence_gain'] is None
          assert x['performance_gain_verified'] is False
          print(json.dumps(x, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-qwen2-cpu-paired-measurement
          path: synthetic_cpu_paired_report.json
          retention-days: 7
