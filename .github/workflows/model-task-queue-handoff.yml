name: Model patch to Ouroboros queue handoff
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/model-task-queue-handoff.yml"
      - "scripts/model_task_queue_bridge.py"
      - "tests/test_model_task_queue_bridge.py"
      - "scripts/resumable_task_queue.py"
      - "scripts/verified_model_patch_review.py"
      - "proposals/feedback_cycle_guard_7b.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare_candidate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Offline handoff and source guard tests
        run: |
          python3 -m unittest discover -s tests -p test_model_task_queue_bridge.py -v
          python3 -m unittest discover -s tests -p test_verified_model_patch_review.py -v
      - name: Prefetch isolated no-network Docker base
        run: docker pull python:3.11-slim
      - name: Prepare independent Docker-verified candidate and pending queue
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          python3 scripts/model_task_queue_bridge.py prepare \
            --docker --head-sha "$CHECKOUT_SHA" \
            --out artifacts/model-task-queue
          test "$(git status --porcelain -- scripts/feedback_controller.py)" = ""
          python3 - <<'PY'
          import json
          from pathlib import Path
          directory=Path("artifacts/model-task-queue")
          result=json.loads((directory/"receipt.json").read_text())
          assert result["gate"] == "docker_replay_passed"
          assert result["code_applied"] is False
          assert result["completed_tasks"] == 0
          assert result["merge_authorized"] is False
          print("PASS: candidate verified; source unchanged; queued for external review")
          PY
      - name: Upload pending task checkpoint, patch and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-to-queue-handoff-v1
          path: artifacts/model-task-queue/
          if-no-files-found: error
          retention-days: 7

  restore_pending_task:
    needs: prepare_candidate
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Restore candidate artifacts in separate job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: model-to-queue-handoff-v1
          path: artifacts/model-task-queue
      - name: Validate stored queue/patch/head without advancing work
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          python3 scripts/model_task_queue_bridge.py verify \
            --head-sha "$CHECKOUT_SHA" \
            --out artifacts/model-task-queue
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("artifacts/model-task-queue/queue.json").read_text())
          assert q["index"] == 0 and q["generation"] == 0
          assert q["requires_human_merge_approval"] is True
          print("PASS: new-job queue recovery; completed tasks 0; merge still blocked")
          PY
