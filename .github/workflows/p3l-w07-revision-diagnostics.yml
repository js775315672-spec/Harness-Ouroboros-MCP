name: W07 revision diagnostics
on:
  pull_request:
    paths:
      - ".github/workflows/p3l-w07-revision-diagnostics.yml"
permissions:
  contents: read
jobs:
  historical:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/p3l-w07-revision-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 'f2c8c5d37c7f4fe79a658cc25a6b0ec126972578'
          persist-credentials: false
      - name: Verify historical regression modules at original SHA
        run: |
          test "$(git rev-parse HEAD)" = 'f2c8c5d37c7f4fe79a658cc25a6b0ec126972578'
          PYTHONPATH=tests:scripts python3 -B -m unittest -v test_ledger_rule_diagnostics test_p3g_qwen_ledger_feedback_repair test_p3l_w02_model_handoff test_p3l_w02_public_prompt_clarity test_p3l_w04_one_call_gate test_p3l_w05_replay_evidence test_p3l_w06_actual_model_once test_p3l_w01_zero_drift_gate
  candidate_contract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/p3l-w07-revision-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '8ba5fa0117b1acee6061b5d1fcd8518b1998bdcc'
          persist-credentials: false
      - name: Reconstruct and verify reviewed candidate
        run: |
          test "$(git rev-parse 'HEAD^{tree}')" = '0863df1be5c336415f8ed2a5fcd7d15e31ffea16'
          exact=$(printf '%s' '' | base64 -d | git hash-object -t commit -w --stdin)
          test "$exact" = '3cbbf0adb1bc3e958e0a7430fbcfea3fa710e267'
          git -c advice.detachedHead=false checkout --detach "$exact"
          test "$(git rev-parse HEAD)" = '3cbbf0adb1bc3e958e0a7430fbcfea3fa710e267'
          sha256sum tests/test_resumable_task_queue.py
      - name: Verify reviewed candidate against the public W01 contract
        run: |
          PYTHONPATH=scripts python3 -B - <<'PY'
          import json
          from development_ledger import validate
          from p3l_w01_contract_drift import audit
          report = audit(validate)
          print(json.dumps(report, sort_keys=True))
          if report["matches"] != 19 or report["mismatches"]:
              raise SystemExit("reviewed candidate contract did not pass")
          PY
