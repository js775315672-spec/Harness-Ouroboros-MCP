name: Ouroboros checkpoint handoff smoke
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ouroboros-checkpoint-smoke.yml'
      - 'scripts/resumable_task_queue.py'
      - 'tests/test_resumable_task_queue.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  create_checkpoint:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout unprivileged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify offline queue tests
        run: python -m unittest discover -s tests -p test_resumable_task_queue.py -v
      - name: Build read-only checkpoint
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          mkdir -p artifacts
          cat > artifacts/queue-smoke-tasks.json <<'JSON'
          [{"id":"checkpoint-smoke","description":"Verify checkpoint transfer only; no coding execution"}]
          JSON
          python scripts/resumable_task_queue.py init \
            --tasks artifacts/queue-smoke-tasks.json \
            --repo js775315672-spec/Harness-Ouroboros-MCP \
            --commit "$EXPECTED_SHA" \
            --checkpoint artifacts/resumable-queue.json
          python scripts/resumable_task_queue.py inspect \
            --checkpoint artifacts/resumable-queue.json \
            > artifacts/queue-smoke-inspect.json
      - name: Publish checkpoint for separate job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ouroboros-checkpoint-smoke
          path: artifacts/resumable-queue.json
          if-no-files-found: error
          retention-days: 7

  restore_checkpoint:
    needs: create_checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout unprivileged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download previous job checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ouroboros-checkpoint-smoke
          path: artifacts
      - name: Validate checkpoint before resuming
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          from resumable_task_queue import load, next_action
          state = load("artifacts/resumable-queue.json")
          assert state["base_commit"] == os.environ["EXPECTED_SHA"]
          assert state["last_commit"] == os.environ["EXPECTED_SHA"]
          assert state["index"] == 0 and state["generation"] == 0
          status = next_action(state)
          assert status["decision"] == "await_external_executor"
          assert status["autonomous_coding_connected"] is False
          assert status["merge_authorized"] is False
          print("PASS: checkpoint restored in separate job; no model or patch executed")
          PY
